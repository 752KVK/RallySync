  /* ---------- selection ---------- */
  function select(k, mode){
    if(mode === "range" && cur){
      const [r0, c0] = rc(cur), [r1, c1] = rc(k); sel.clear();
      for(let r = Math.min(r0, r1); r <= Math.max(r0, r1); r++) for(let c = Math.min(c0, c1); c <= Math.max(c0, c1); c++) if(!inCastle(r, c)) sel.add(kOf(r, c));
    } else if(mode === "toggle"){ if(sel.has(k) && sel.size > 1) sel.delete(k); else sel.add(k); cur = k; }
    else { sel.clear(); sel.add(k); cur = k; }
    paint();
  }
  function deselect(){ sel.clear(); cur = null; moveFrom = null; closeSheet(); paint(); }
  function step(dr, dc){
    if(!cur) return;
    let [r, c] = rc(cur);
    do { r += dr; c += dc; } while(r >= 0 && r < N && c >= 0 && c < N && inCastle(r, c));
    if(r < 0 || r >= N || c < 0 || c >= N) return;
    select(kOf(r, c));
    const el = tileEl(cur); if(el) el.scrollIntoView({block:"nearest", inline:"nearest"});
  }
  const isEnemy = k=>!!(P && P.tiles[k] && P.tiles[k].c === "p");
  function edit(k, f, replace){
    const el = tileEl(k); if(!el || coarse) return;
    if(f !== "t" && isEnemy(k)) return;   // enemy zone: no player name
    lastField = f;
    const x = f === "t" ? el.children[1] : el.children[2];
    x.focus();
    if(f === "t"){ if(replace) x.select(); else x.setSelectionRange(x.value.length, x.value.length); }
    else { const r = document.createRange(); r.selectNodeContents(x); if(!replace) r.collapse(false); const s = getSelection(); s.removeAllRanges(); s.addRange(r); }
  }
  const targets = k=>(sel.has(k) && sel.size > 1) ? [...sel] : [k];
  function setClan(k, g){ change(targets(k).map(x=>({path:`tiles/${x}/g`, val:g}))); }
  function setFill(c){ if(!sel.size){ toast(t("kpSelFirst")); return; } change([...sel].map(x=>({path:`tiles/${x}/c`, val:c}))); }
  function clearSel(){ if(!sel.size){ toast(t("kpSelFirst")); return; } const l = []; sel.forEach(x=>{ l.push({path:`tiles/${x}/g`, val:""}, {path:`tiles/${x}/n`, val:""}); }); change(l); }
  function swap(a, b){
    if(a === b || !P) return;
    if(isEnemy(a) || isEnemy(b)){ toast("⛔ " + t("kpEnemyNo")); return; }
    const A = P.tiles[a] || {}, B = P.tiles[b] || {};
    change([{path:`tiles/${a}/g`, val:B.g || ""}, {path:`tiles/${a}/n`, val:B.n || ""}, {path:`tiles/${b}/g`, val:A.g || ""}, {path:`tiles/${b}/n`, val:A.n || ""}]);
  }
  const cleanName = s=>String(s || "").replace(/\s+/g, " ").trim().slice(0, 40);
  const cleanTime = s=>{ let v = String(s || "").trim().slice(0, 8); if(/^\d+$/.test(v)) v += "s"; return v; };

  /* ---------- menus ---------- */
  let kpMenu = null;
  function closeKpMenu(){ if(kpMenu){ kpMenu.remove(); kpMenu = null; } }
  function popMenu(anchor, items){
    closeKpMenu();
    const m = document.createElement("div"); m.className = "menu kp-menu";
    m.innerHTML = items.map((it, i)=>it === "-" ? `<div class="sepm"></div>` : `<button type="button" data-mi="${i}"${it.on ? ' class="on"' : ""}>${it.dot ? `<span class="dot" style="--c:${it.dot}"></span>` : ""}${esc(it.label)}</button>`).join("");
    document.body.appendChild(m); kpMenu = m;
    const r = anchor.getBoundingClientRect(), mw = m.offsetWidth, mh = m.offsetHeight;
    m.style.left = Math.max(6, Math.min(innerWidth - mw - 6, r.left)) + "px";
    m.style.top = (r.bottom + mh + 6 > innerHeight ? Math.max(6, r.top - mh - 4) : r.bottom + 4) + "px";
    m.addEventListener("click", e=>{ const b = e.target.closest("[data-mi]"); if(!b) return; closeKpMenu(); items[+b.dataset.mi].act(); });
  }
  document.addEventListener("pointerdown", e=>{ if(kpMenu && !kpMenu.contains(e.target)) closeKpMenu(); }, true);
  function tagMenu(k, anchor){
    if(isEnemy(k)){ toast("⛔ " + t("kpEnemyNo")); return; }
    const curTag = pget(`tiles/${k}/g`);
    const items = P.clans.map((c, i)=>({label:c, dot:CLANC[i % CLANC.length], on:c === curTag, act:()=>setClan(k, c)}));
    items.push("-", {label:"— " + t("kpNone"), act:()=>setClan(k, "")});
    popMenu(anchor, items);
  }

  /* ---------- mouse: select, edit, drag a city onto another tile ---------- */
  let pd = null, ghost = null, dropEl = null;
  boardEl.addEventListener("pointerdown", e=>{
    if(!P || e.button > 0) return;
    const tile = e.target.closest(".pt"); if(!tile) return;
    const k = tile.dataset.k, touch = coarse || e.pointerType !== "mouse";
    if(touch){ pd = {k, x:e.clientX, y:e.clientY, touch:true, id:e.pointerId}; return; }
    const field = e.target.closest(".pt-g") ? "g" : e.target.closest(".pt-t") ? "t" : "n";
    if(field !== "g" && document.activeElement === e.target) return;            // already editing this field: normal caret behaviour
    const ae = document.activeElement; if(ae && ae !== document.body && root.contains(ae)) ae.blur();   // commit any other edit
    const mod = e.shiftKey ? "range" : (e.ctrlKey || e.metaKey) ? "toggle" : "";
    select(k, mod);
    e.preventDefault();
    pd = {k, field, mod, x:e.clientX, y:e.clientY, drag:false, id:e.pointerId};
  });
  boardEl.addEventListener("mousedown", e=>{ if(pd && !pd.touch && e.target.closest(".pt") && document.activeElement !== e.target) e.preventDefault(); });
  addEventListener("pointermove", e=>{
    if(!pd || pd.touch || pd.mod || e.pointerId !== pd.id) return;
    if(!pd.drag){
      if(Math.hypot(e.clientX - pd.x, e.clientY - pd.y) < 8) return;
      const d = P.tiles[pd.k] || {}; if(!d.n && !d.g){ pd = null; return; }      // nothing to move
      pd.drag = true; closeKpMenu();
      ghost = document.createElement("div"); ghost.className = "kp-ghost"; ghost.textContent = (d.g ? "[" + d.g + "] " : "") + (d.n || "—"); document.body.appendChild(ghost);
    }
    ghost.style.transform = `translate(${e.clientX + 12}px,${e.clientY + 12}px)`;
    const el = document.elementFromPoint(e.clientX, e.clientY), tile = el && el.closest && el.closest(".pt");
    if(tile !== dropEl){ if(dropEl) delete dropEl.dataset.drop; if(tile && tile.dataset.k !== pd.k) tile.dataset.drop = "1"; dropEl = tile; }
    const vr = view.getBoundingClientRect(), edge = 40;
    view.scrollBy((e.clientX > vr.right - edge ? 14 : e.clientX < vr.left + edge ? -14 : 0), (e.clientY > vr.bottom - edge ? 14 : e.clientY < vr.top + edge ? -14 : 0));
  });
  function endPointer(e, cancel){
    if(!pd || (e && e.pointerId !== pd.id)) return;
    const d = pd; pd = null;
    if(ghost){ ghost.remove(); ghost = null; }
    const target = dropEl; if(dropEl){ delete dropEl.dataset.drop; dropEl = null; }
    if(cancel || !P) return;
    if(d.touch){
      if(Math.hypot(e.clientX - d.x, e.clientY - d.y) > 10) return;                // it was a scroll, not a tap
      if(moveFrom){ const from = moveFrom; moveFrom = null; swap(from, d.k); select(d.k); openSheet(true); return; }
      select(d.k); openSheet(true); return;
    }
    if(d.drag){ if(target && target.dataset.k !== d.k){ swap(d.k, target.dataset.k); select(target.dataset.k); } return; }
    if(d.mod) return;
    if(d.field === "g"){ const el = tileEl(d.k); if(el) tagMenu(d.k, el.children[0]); }
    else edit(d.k, d.field, true);
  }
  addEventListener("pointerup", e=>endPointer(e, false));
  addEventListener("pointercancel", e=>endPointer(e, true));
  view.addEventListener("pointerdown", e=>{ if(e.target === view || e.target === wrap || e.target === boardEl || e.target === layer){ actObj = null; fmtT = "tiles"; const ae = document.activeElement; if(ae && root.contains(ae) && ae !== document.body) ae.blur(); deselect(); } });

  /* ---------- committing edits ---------- */
  boardEl.addEventListener("focusin", e=>{ const tile = e.target.closest(".pt"); if(tile){ lastField = e.target.classList.contains("pt-t") ? "t" : "n"; if(!sel.has(tile.dataset.k) || cur !== tile.dataset.k){ sel.clear(); sel.add(tile.dataset.k); cur = tile.dataset.k; paint(); } } });
  boardEl.addEventListener("focusout", e=>{
    if(!P) return;
    const x = e.target, tile = x.closest(".pt");
    if(tile){
      const k = tile.dataset.k;
      if(x.classList.contains("pt-t")){
        if(x.dataset.cancel){ delete x.dataset.cancel; x.value = pget(`tiles/${k}/t`); return; }
        const v = cleanTime(x.value); x.value = v; change([{path:`tiles/${k}/t`, val:v}]);
      } else if(x.classList.contains("pt-n")){
        if(x.dataset.cancel){ delete x.dataset.cancel; x.textContent = pget(`tiles/${k}/n`); return; }
        const v = cleanName(x.textContent); x.textContent = v; change([{path:`tiles/${k}/n`, val:v}]);
      }
    } else if(x.dataset.cf){
      if(x.dataset.cancel){ delete x.dataset.cancel; x.value = pget("castle/" + x.dataset.cf); return; }
      const v = x.value.trim(); x.value = v; change([{path:"castle/" + x.dataset.cf, val:v}]);
    }
  });
  /* ---------- objects on the map: notes, rectangles, circles (move, resize, write in them) ---------- */
  const emPx = ()=>parseFloat(getComputedStyle(wrap).fontSize) || 16;
  const clamp = (v, a, b)=>Math.max(a, Math.min(b, v));
  function mkObj(id, k){
    const el = document.createElement("div");
    el.className = "kp-obj k-" + k; el.dataset.id = id; el.dataset.k = k;
    const ctl = `<button type="button" class="ko-col" tabindex="-1">●</button><button type="button" class="ko-del" tabindex="-1">✕</button><span class="ko-rs"></span>`;
    el.innerHTML = k === "note"
      ? `<div class="ko-head"><input class="ko-title" maxlength="30" spellcheck="false" autocomplete="off" tabindex="-1"></div><textarea class="ko-txt" maxlength="5000" spellcheck="false" autocomplete="off"></textarea>${ctl}`
      : `<i class="ko-e t"></i><i class="ko-e r"></i><i class="ko-e b"></i><i class="ko-e l"></i><span class="ko-grip">✥</span><div class="ko-txt" spellcheck="false"></div>${ctl}`;
    if(k !== "note"){ const x = el.querySelector(".ko-txt"); x.setAttribute("contenteditable", ceMode); }
    return el;
  }
  let ceMode = "plaintext-only";
  try{ const probe = document.createElement("div"); probe.contentEditable = ceMode; if(probe.contentEditable !== ceMode) ceMode = "true"; }catch(e){ ceMode = "true"; }
  const objText = x=>x.tagName === "TEXTAREA" ? x.value : x.innerText.replace(/\n$/, "");
  function paintObjs(ae){
    const have = {};
    layer.querySelectorAll(".kp-obj").forEach(e=>{ have[e.dataset.id] = e; });
    for(const id in P.shapes){
      const o = P.shapes[id]; let el = have[id]; delete have[id];
      if(!el || el.dataset.k !== o.k){ if(el) el.remove(); el = mkObj(id, o.k); layer.appendChild(el); }
      if(!(od && od.id === id && od.moved)){ el.style.left = o.x + "em"; el.style.top = o.y + "em"; el.style.width = o.w + "em"; el.style.height = o.h + "em"; }
      const tx = el.querySelector(".ko-txt");
      if(tx !== ae && objText(tx) !== o.t){ if(tx.tagName === "TEXTAREA") tx.value = o.t; else tx.textContent = o.t; }
      tx.style.fontSize = o.s ? (+o.s / 12) + "em" : ""; tx.style.fontWeight = o.b === "1" ? "700" : "";
      tx.dataset.ph = o.k === "note" ? "" : t("kpText");
      const ti = el.querySelector(".ko-title"); if(ti){ ti.placeholder = t("kpNotes"); if(ti !== ae && ti.value !== o.ti) ti.value = o.ti; }
      el.style.setProperty("--oc", o.c || (o.k === "note" ? OCOL[0] : OCOL[1]));
      el.classList.toggle("on", actObj === id);
    }
    for(const id in have) have[id].remove();
    let mw = BW, mh = BH; for(const id in P.shapes){ const o = P.shapes[id]; mw = Math.max(mw, o.x + o.w + 1); mh = Math.max(mh, o.y + o.h + 1); }
    wrap.style.width = mw + "em"; wrap.style.height = mh + "em";
    if(actObj && !P.shapes[actObj]){ actObj = null; if(fmtT !== "tiles") fmtT = "tiles"; }
  }
  function addObj(k){
    if(!P) return;
    const o = defObj(k), em = emPx(), vr = view.getBoundingClientRect(), wr = wrap.getBoundingClientRect();
    const cx = (vr.left + vr.width / 2 - wr.left) / em, cy = (vr.top + vr.height / 2 - wr.top) / em;
    if(k === "note"){ o.h = 24; }
    o.x = Math.round(clamp(cx - o.w / 2, 0, BW - o.w) * 100) / 100; o.y = Math.round(clamp(cy - o.h / 2, 0, BH - o.h) * 100) / 100;
    for(let i = 0; i < 12; i++){   // do not drop it exactly on top of another one
      const busy = Object.values(P.shapes).some(q=>Math.abs((q.x + q.w / 2) - (o.x + o.w / 2)) < 3 && Math.abs((q.y + q.h / 2) - (o.y + o.h / 2)) < 3);
      if(!busy) break; o.x = Math.round((o.x + 5) * 100) / 100; o.y = Math.round((o.y + 4) * 100) / 100;
    }
    const id = "o" + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    sel.clear(); cur = null; actObj = id; fmtT = "obj:" + id;
    change([{path:"shapes/" + id, val:o}]);
    const ae = document.activeElement; if(ae && ae.blur && ae !== document.body) ae.blur();
    const x = layer.querySelector(`.kp-obj[data-id="${id}"] .ko-txt`); if(x && !coarse) x.focus();
  }
  ["kpAddNote", "kpAddRect", "kpAddCirc"].forEach(i=>$(i).addEventListener("mousedown", e=>e.preventDefault()));
  $("kpAddNote").addEventListener("click", ()=>addObj("note"));
  $("kpAddRect").addEventListener("click", ()=>addObj("rect"));
  $("kpAddCirc").addEventListener("click", ()=>addObj("circle"));
  function delObj(id){ if(actObj === id){ actObj = null; fmtT = "tiles"; } change([{path:"shapes/" + id, val:""}]); }
  function colMenu(id, anchor){
    const curC = (P.shapes[id] || {}).c;
    popMenu(anchor, OCOL.map(c=>({label:"", dot:c, on:c === curC, act:()=>change([{path:`shapes/${id}/c`, val:c}])})));
  }

  function show(i){ const s = strips[i]; s.style.transition = "none"; s.style.transform = `translateY(${-(L+pos[i])*ch()}px)`; }
  function tickSound(f, d){ try{ beep(f||520, d||.03, "fx"); }catch(e){} }
  const isLocked = ()=>document.documentElement.classList.contains("locked");

  function texts(){
    try{ volUI(); }catch(e){}
    document.getElementById("lockTop").title = t("lock");
    gate.querySelector(".g-sign small").textContent = "♠ ♥ " + t("gSub") + " ♦ ♣";
    spinBtn.textContent = "🎰 " + t("gSpin");
    pass.placeholder = t("gPass");
    document.getElementById("gHint").textContent = t("gHint");
    langLabels();
  }
  eye.addEventListener("click", ()=>{ const v = pass.type === "password"; pass.type = v ? "text" : "password"; eye.classList.toggle("on", v); pass.focus(); });
  pass.addEventListener("keydown", e=>{ if(e.key === "Enter"){ e.preventDefault(); spin(); } });
  pass.addEventListener("input", ()=>{ msg.textContent = ""; msg.className = "g-msg"; });

  function spin(){
    if(busy) return;
    const code = pass.value.trim();
    msg.className = "g-msg";
    if(!code){ msg.textContent = t("gEmpty"); msg.className = "g-msg lose"; cab.classList.remove("shake"); void cab.offsetWidth; cab.classList.add("shake"); pass.focus(); return; }
    busy = true; spinBtn.disabled = true; pass.disabled = true; msg.textContent = "";
    try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume && actx.resume(); }catch(e){}
    lever.classList.add("pulled"); setTimeout(()=>lever.classList.remove("pulled"), 450);
    const ok = cyrb53("rallysync:" + code, 7) === HASH;
    // where the reels stop: S-H-0 on a win, NOOB-NOOB-NOOB on a loss
    const target = ok ? WIN.slice() : [NOOB, NOOB, NOOB];
    const h = ch(), ticking = setInterval(()=>tickSound(300 + Math.random()*400, .02), 90);
    strips.forEach((s,i)=>{
      s.style.transition = "none"; s.style.transform = `translateY(${-pos[i]*h}px)`; s.classList.add("blur");
      void s.offsetHeight;
      const dur = 900 + i*450, end = L*(REP-2) + target[i];
      s.style.transition = `transform ${dur}ms cubic-bezier(.12,.6,.2,1)`;
      s.style.transform = `translateY(${-end*h}px)`;
      setTimeout(()=>{ s.classList.remove("blur"); pos[i] = target[i]; show(i); tickSound(880,.06);
        if(i === N-1){ clearInterval(ticking); setTimeout(()=>result(ok), 150); } }, dur + 20);
    });
  }
  function result(ok){
    if(ok){
      msg.textContent = "🎉 " + t("gWin") + " 🎉"; msg.className = "g-msg win"; gate.classList.add("win","flash");
      [523,659,784,1046].forEach((f,k)=>setTimeout(()=>tickSound(f,.18), k*120));
      coins();
      try{ sessionStorage.setItem(GATE_KEY, JSON.stringify({h:HASH, until:Date.now()+REMEMBER_MS})); }catch(e){}   // only while this tab stays open
      setTimeout(()=>gate.classList.add("out"), 1300);
      setTimeout(()=>{ document.documentElement.classList.remove("locked"); afterUnlock(); gate.classList.remove("out","win","flash");
        busy = false; spinBtn.disabled = false; pass.disabled = false; pass.value = ""; layout(); }, 1900);
    } else {
      msg.textContent = t("gLose"); msg.className = "g-msg lose";
      cab.classList.remove("shake"); void cab.offsetWidth; cab.classList.add("shake"); tickSound(160,.25);
      busy = false; spinBtn.disabled = false; pass.disabled = false; pass.select(); pass.focus();
    }
  }
  function coins(){
    const icons = ["🪙","💰","💎","🪙","🍀","7️⃣"];
    for(let k=0;k<46;k++){ const c = document.createElement("span"); c.className = "g-coin"; c.textContent = icons[k%icons.length];
      c.style.left = Math.random()*100 + "vw"; c.style.animationDuration = (1.2 + Math.random()*1.4) + "s"; c.style.animationDelay = (Math.random()*.6) + "s";
      document.body.appendChild(c); setTimeout(()=>c.remove(), 3200); }
  }
  spinBtn.addEventListener("click", spin);
  /* lever: tap or drag it down */
  let ly = null;
  lever.addEventListener("pointerdown", e=>{ ly = e.clientY; lever.setPointerCapture && lever.setPointerCapture(e.pointerId); e.preventDefault(); });
  lever.addEventListener("pointermove", e=>{ if(ly!=null && e.clientY - ly > 40){ ly = null; spin(); } });
  lever.addEventListener("pointerup", ()=>{ if(ly!=null){ ly = null; spin(); } });
  function lockNow(){
    try{ sessionStorage.removeItem(GATE_KEY); }catch(e){}
    document.getElementById("settings").open && document.getElementById("settings").close();
    pass.value = ""; msg.textContent = ""; msg.className = "g-msg"; document.documentElement.classList.add("locked"); focusPass();
  }
  document.getElementById("lockBtn").addEventListener("click", lockNow);
  document.getElementById("lockTop").addEventListener("click", lockNow);
  // focus the field on computers (on phones, wait for a tap so the keyboard does not pop up by itself)
  function focusPass(){ if(matchMedia("(pointer:fine)").matches) setTimeout(()=>pass.focus(), 50); }
  // casino sounds start muted on every visit (countdown beeps are not affected); 🔇 brings them back
  if((S.volFx ?? .4) > 0) S._fxPrev = S.volFx ?? .4;
  S.volFx = 0;
  const gVol = document.getElementById("gVol"), gMute = document.getElementById("gMute");
  function volUI(){ const v = S.sound ? Math.round((S.volFx ?? .4)*100) : 0; gVol.value = v; gMute.textContent = v === 0 ? "🔇" : v < 50 ? "🔉" : "🔊"; }
  gVol.addEventListener("input", ()=>{ S.volFx = gVol.value/100; if(+gVol.value > 0) S.sound = true; save(); volUI(); });
  gVol.addEventListener("change", ()=>tickSound(784,.12));
  gMute.addEventListener("click", ()=>{ if((S.volFx ?? .4) > 0 && S.sound){ S._fxPrev = S.volFx ?? .4; S.volFx = 0; } else { S.volFx = S._fxPrev || .4; S.sound = true; } save(); volUI(); tickSound(784,.08); });
  volUI();
  texts(); requestAnimationFrame(()=>strips.forEach((_,i)=>show(i)));
  addEventListener("resize", ()=>strips.forEach((_,i)=>show(i)));
  if(isLocked()) focusPass(); else afterUnlock();
  const _render = render; render = function(){ _render.apply(this, arguments); texts(); };
})();
</script>
</body>
</html>
