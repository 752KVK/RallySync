<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rally Sync — rally timer for Kingshot (fan-made)</title>
<meta name="description" content="Unofficial fan-made rally launch coordinator. Not affiliated with Kingshot or its publisher. Data stays in your browser.">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rally Sync">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<style>
:root{
  --bg:#0f1115; --panel:#181b22; --panel2:#20242d; --line:#2c313c; --text:#e8eaf0; --muted:#8b93a5;
  --accent:#f5b83d; --go:#2ecc71; --warn:#f39c12; --danger:#e74c3c; --drop:#f5b83d33; --shadow:0 8px 30px #0008;
  color-scheme: dark;
}
:root[data-theme="light"]{
  --bg:#f3f4f7; --panel:#ffffff; --panel2:#f0f2f6; --line:#dde1e8; --text:#161922; --muted:#646c7c;
  --accent:#c98a00; --go:#1e9e55; --warn:#d07b00; --danger:#d0362a; --drop:#c98a0022; --shadow:0 8px 30px #0002;
  color-scheme: light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 10px}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.4;cursor:default}
input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}

header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.brand{font-weight:800;letter-spacing:.3px;margin-right:auto;display:flex;align-items:baseline;gap:8px}
.brand small{color:var(--muted);font-weight:500}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.btn-go{background:var(--go);border-color:var(--go);color:#fff;font-weight:800}
.btn-stop{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 8px;background:transparent}
.seg button.on{background:var(--accent);color:#111;font-weight:700}

.hint{color:var(--muted);font-size:12px;padding:6px 12px}
main.free{display:block;position:relative;z-index:0;padding:0;margin:0 12px;min-height:calc(100vh - 110px)}
main.free .card{position:absolute;width:340px;left:0;top:0;display:flex;flex-direction:column}
main.free .card{overflow:hidden}
main.free .card .inner{transform-origin:0 0}
main.free.anim .card .inner{transition:transform .25s ease}
.resizer{display:none}
main.free .resizer{display:block;position:absolute;right:0;bottom:0;width:20px;height:20px;cursor:nwse-resize;touch-action:none;border-bottom-right-radius:12px;
  background:linear-gradient(135deg,transparent 0 55%,var(--muted) 55% 60%,transparent 60% 70%,var(--muted) 70% 75%,transparent 75%);opacity:.6}
main.free .resizer:hover{opacity:1}
main.free .thead{cursor:move;touch-action:none;user-select:none}
main.free .thead .tname{cursor:move}
main.free.anim .card{transition:left .25s ease,top .25s ease,width .25s ease}
.card.lifted{box-shadow:var(--shadow),0 0 0 2px var(--c);opacity:.97}
.grip{color:var(--muted);font-size:13px;letter-spacing:-2px;margin-right:2px}
main:not(.free) .grip{display:none}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;padding:0 12px 120px;align-items:start}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;border-top:4px solid var(--c,var(--muted));transition:box-shadow .12s,border-color .12s}
.card.drop-on{box-shadow:0 0 0 3px var(--accent) inset;background:linear-gradient(var(--drop),var(--drop)),var(--panel)}
.card.bench{--c:var(--muted)}
.card.running{box-shadow:0 0 0 1px var(--c)}
.thead{display:flex;gap:6px;align-items:center;padding:8px 10px 4px}
.tname{font-weight:800;font-size:16px;flex:0 1 auto;margin-right:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
.tname[data-act=rename]{margin-right:0}
.ally{margin-right:auto;width:64px;min-width:44px;max-width:120px;padding:1px 6px;font-size:12px;font-weight:700;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--c);text-transform:none}
.ally:hover{border-color:var(--line)}
.ally:placeholder-shown{border:1px dashed var(--line);color:var(--muted)}
.ally::placeholder{color:var(--muted);font-weight:500}
.cdot{position:relative;width:14px;height:14px;border-radius:50%;background:var(--c);flex:none;cursor:pointer;box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--line)}
.cdot input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;border:0;cursor:pointer}
.tnum{background:var(--c);color:#111;font-weight:800;border-radius:6px;padding:0 6px;font-size:12px}
.icon{padding:4px 7px;background:transparent;border-color:transparent;color:var(--muted)}
.icon:hover{color:var(--text);border-color:var(--line)}
.trow{display:flex;gap:6px;align-items:center;padding:2px 10px 8px;flex-wrap:wrap}
.trow label{color:var(--muted);font-size:12px}
.rally-in{width:58px;text-align:center}
.status{margin:0 10px 8px;padding:6px 10px;border-radius:8px;background:var(--panel2);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:8px;font-size:14px}
.status b{font-size:18px}
.status.landed{background:var(--go);color:#fff}

ul.players{list-style:none;margin:0;padding:0 6px 6px;min-height:44px}
.empty{color:var(--muted);text-align:center;font-size:13px;padding:12px;border:1px dashed var(--line);border-radius:8px;margin:4px}
li.player{display:grid;grid-template-columns:18px minmax(50px,1fr) 58px 72px 26px 22px;gap:4px;align-items:center;padding:4px;border-radius:8px}
li.player.next{background:var(--panel2);box-shadow:inset 3px 0 0 var(--c)}
li.player.gone{opacity:.45}
.march.unset{border-color:var(--warn);color:var(--warn)}
li.player:hover{background:var(--panel2)}
li.player.ghost-src{opacity:.35}
.handle{cursor:grab;color:var(--muted);text-align:center;touch-action:none;user-select:none;font-size:18px;line-height:1}
.pname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;touch-action:none;user-select:none;cursor:grab}
.pname .star{color:var(--accent);margin-left:4px;font-size:12px}
.march{width:100%;text-align:center;font-variant-numeric:tabular-nums;padding:4px}
.march.bad{border-color:var(--danger)}
.cd{text-align:right;width:100%;font-variant-numeric:tabular-nums;font-weight:700;border-radius:6px;padding:3px 6px;white-space:nowrap}
.cd.idle{color:var(--muted);font-weight:600}
.cd.soon{color:var(--warn)}
.cd.hot{background:var(--danger);color:#fff;animation:pulse .5s infinite alternate}
.cd.now{background:var(--go);color:#fff;text-align:center}
.cd.done{color:var(--go)}
@keyframes pulse{to{opacity:.65}}
.addrow{display:flex;gap:6px;padding:4px 10px 10px}
.when{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.abs{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;padding-right:6px}
.utcrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 10px 6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.utcrow>span{white-space:nowrap}
.utcrow b{color:var(--text);font-size:15px}
.planbtn{padding:4px 9px;font-size:13px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.planbtn.on{color:var(--accent);border-color:var(--accent)}
.utcclock{font-variant-numeric:tabular-nums;font-weight:700;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.addrow input{flex:1}

.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:100;background:var(--panel);border:1px solid var(--accent);box-shadow:var(--shadow);opacity:.95;border-radius:8px}
.menu{position:fixed;z-index:110;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:170px;max-height:70vh;overflow:auto}
.menu .mt{color:var(--muted);font-size:12px;padding:2px 6px}
.menu button{text-align:left;display:flex;gap:8px;align-items:center}
.menu .sepm{height:1px;background:var(--line);margin:2px 0}
.menu .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:200;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1;pointer-events:auto}
.toast button{margin-left:10px;background:var(--accent);border-color:var(--accent);color:#111;font-weight:700;padding:3px 10px}
#ask p{margin:0 0 10px}
#ask input,#ask textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px}
#ask .row{justify-content:flex-end}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;max-width:420px;width:92vw}
dialog::backdrop{background:#0008}
dialog .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0}
dialog h3{margin:0 0 6px}
.about{color:var(--muted);font-size:12px;margin:10px 0 0;line-height:1.4}
.sep{width:1px;align-self:stretch;background:var(--line)}
.jump{display:none}
@media (max-width:699px){
  header{gap:5px;padding:6px;padding-top:max(6px,env(safe-area-inset-top));padding-left:max(6px,env(safe-area-inset-left));padding-right:max(6px,env(safe-area-inset-right))}
  .hide-sm,.hide-xs,.hint{display:none !important}
  .brand{margin-right:0;font-size:18px}
  .utcclock{margin-right:auto;font-size:13px;padding:8px 7px}
  header>button{padding:8px 9px;min-height:38px;font-size:13px}
  #addTeam,#undo,#settingsBtn{min-width:38px;padding:8px 6px}
  main{grid-template-columns:1fr;gap:10px;padding:8px 8px calc(60vh + env(safe-area-inset-bottom))}
  .card{scroll-margin-top:calc(var(--hh,110px) + 8px)}
  /* team quick-jump bar with live next-launch countdown */
  .jump{display:flex;gap:6px;overflow-x:auto;width:100%;scrollbar-width:none;padding:2px 0 0}
  .jump::-webkit-scrollbar{display:none}
  .chip{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-weight:700;font-size:14px;min-height:34px}
  .chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
  .chip small{font-variant-numeric:tabular-nums;font-weight:800}
  .chip.soon small{color:var(--warn)}
  .chip.hot{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulse .5s infinite alternate}
  .chip.hot small{color:#fff}
  /* bigger touch targets, 16px inputs (stops iOS auto-zoom) */
  input,.march,.ally,#ask input,#ask textarea{font-size:16px}
  .addrow input{padding:9px 10px}
  .addrow button{min-width:44px}
  .seg button{padding:7px 9px}
  .trow{gap:8px}
  .btn-go,.btn-stop{min-height:38px;padding:7px 14px}
  .icon{min-width:34px;min-height:34px;font-size:16px}
  .tname{font-size:17px}
  .ally{font-size:16px}
  .cdot{width:22px;height:22px}
  li.player{grid-template-columns:26px minmax(0,1fr) 64px 76px 36px 32px;gap:3px;padding:6px 2px;min-height:48px}
  .handle{font-size:24px;padding:6px 0}
  .pname{touch-action:pan-y;cursor:default;font-size:16px}
  .march{padding:7px 2px}
  .cd{font-size:17px}
  .cd.now{font-size:14px}
  .status{font-size:15px}
  .status b{font-size:22px}
  .menu button{padding:10px 12px;font-size:16px}
  .toast{bottom:calc(18px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<header>
  <div class="brand hide-xs">⚔️ <span>Rally Sync</span> <small class="hide-sm" data-i="subtitle"></small></div>
  <span class="utcclock" id="clock" title="UTC"></span>
  <button class="btn-go" id="goAll" data-i="goAll"></button>
  <button class="btn-stop" id="stopAll" data-i="stopAll" hidden></button>
  <button id="addTeam">+ <span class="hide-xs" data-i="team"></span></button>
  <button id="alignBtn" class="hide-sm" title="Align">⊞ <span data-i="align"></span></button>
  <button id="undo" title="Ctrl+Z">↶ <span class="hide-xs" data-i="undo"></span></button>
  <div class="seg hide-xs" id="langSeg">
    <button data-lang="en">EN</button><button data-lang="fr">FR</button><button data-lang="ko">한</button><button data-lang="tr">TR</button>
  </div>
  <button id="theme" class="hide-xs" title="Theme">🌓</button>
  <button id="settingsBtn" title="Settings">⚙️</button>
  <nav id="jump" class="jump"></nav>
</header>
<div class="hint" data-i="hint"></div>
<main id="board"></main>

<dialog id="settings">
  <h3 data-i="settings"></h3>
  <div class="row"><span>🌐</span><div class="seg" id="langSeg2"><button data-lang="en">EN</button><button data-lang="fr">FR</button><button data-lang="ko">한국어</button><button data-lang="tr">TR</button></div></div>
  <div class="row"><span>🌓</span><button id="theme2">☀️ / 🌙</button></div>
  <div class="row"><span data-i="lead"></span><input id="leadIn" type="number" min="0" max="120" style="width:70px"></div>
  <div class="row"><span data-i="sound"></span><input id="soundIn" type="checkbox"></div>
  <div class="row">
    <button id="exportBtn" data-i="export"></button>
    <button id="importBtn" data-i="import"></button>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
  </div>
  <div class="row"><button id="resetBtn" class="btn-stop" data-i="reset"></button><button id="closeSettings">OK</button></div>
  <p class="about" data-i="about"></p>
</dialog>
<dialog id="ask"><form method="dialog" id="askForm">
  <p id="askMsg"></p>
  <input id="askIn" autocomplete="off">
  <textarea id="askTa" rows="6" readonly></textarea>
  <div class="row"><button value="cancel" type="button" id="askCancel">✕</button><button value="ok" id="askOk" class="btn-go">OK</button></div>
</form></dialog>
<div class="toast" id="toast"></div>

/* ---------- time helpers ---------- */
function parseTime(str){
  if(str==null) return null;
  const s = String(str).trim().toLowerCase().replace(/\s+/g,"");
  if(!s) return null;
  let m;
  if((m = s.match(/^(\d{1,3}):(\d{1,2})$/))) return +m[1]*60 + +m[2];
  if((m = s.match(/^(?:(\d{1,3})(?:m|min|mn|분|dk))?(?:(\d{1,4})(?:s|sec|sn|초)?)?$/)) && (m[1]||m[2])) return (+m[1]||0)*60 + (+m[2]||0);
  return null;
}
function fmt(sec){ sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec/60), s = sec%60; return m ? `${m}m${String(s).padStart(2,"0")}` : `${s}s`; }
function fmtClock(sec){ const neg = sec<0; sec = Math.abs(Math.ceil(sec)); const h = Math.floor(sec/3600), m = Math.floor(sec/60)%60, s = sec%60, p2 = n=>String(n).padStart(2,"0");
  return (neg?"-":"") + (h ? `${h}:${p2(m)}:${p2(s)}` : m ? `${m}:${p2(s)}` : `${s}`); }
/* UTC wall clock "21:30:52" */
function fmtUTC(ms){ return new Date(ms).toISOString().slice(11,19); }
/* "21:30", "21:30:15", "2130", "21h30" -> next occurrence of that UTC time (ms) */
function parseUTC(str){
  const m = String(str||"").trim().toLowerCase().match(/^(\d{1,2})\s*[:h. ]?\s*(\d{2})(?:\s*[:m.]?\s*(\d{2}))?\s*(?:s|utc)?$/);
  if(!m || +m[1] > 23 || +m[2] > 59 || (m[3] && +m[3] > 59)) return null;
  const now = new Date();
  let tms = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), +m[1], +m[2], +(m[3]||0));
  if(tms < now.getTime() - 5000) tms += 86400000;   // already passed today -> tomorrow
  return tms;
}

/* parse "Yordan 30s, Jimmy 1m46; Bloom 54s" (also newlines) */
function parseRoster(text){
  const out = [], bad = [];
  text.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean).forEach(chunk=>{
    // split name / time: time = last token(s) that parse; allow "Jimmy 1m 46s" and "Jimmy marching time 1m46"
    const toks = chunk.split(/\s+/);
    for(let k=Math.min(2,toks.length-1); k>=1; k--){
      const time = parseTime(toks.slice(-k).join(""));
      if(time!=null){
        const name = toks.slice(0,-k).join(" ").replace(/\b(marching|march|time|temps|de|marche)\b/gi,"").replace(/[:\-–]+$/,"").trim();
        if(name){ out.push({name, march:time}); return; }
      }
    }
    if(toks.length===1 || parseTime(toks[toks.length-1])==null){ out.push({name:chunk, march:0}); return; }
    bad.push(chunk);
  });
  return {out,bad};
}

/* ---------- model helpers ---------- */
function findPlayer(pid){
  for(const tm of S.teams){ const i = tm.players.findIndex(p=>p.id===pid); if(i>=0) return {list:tm.players,i,team:tm}; }
  const i = S.bench.findIndex(p=>p.id===pid); if(i>=0) return {list:S.bench,i,team:null};
  return null;
}
function listOf(dest){ return dest==="bench" ? S.bench : (S.teams.find(x=>x.id===dest)||{}).players; }
function movePlayer(pid, dest){
  const f = findPlayer(pid), to = listOf(dest);
  if(!f || !to || f.list===to) return;
  mutate(()=>{ const [p] = f.list.splice(f.i,1); to.push(p); });
}
/* launch schedule for a team: offset (s) after first launch */
function schedule(tm){
  const max = tm.players.reduce((a,p)=>Math.max(a,p.march||0),0);
  const rows = tm.players.map(p=>({p, off:max-(p.march||0)})).sort((a,b)=>a.off-b.off || a.p.name.localeCompare(b.p.name));
  return {max, rows, total: max + tm.rally};
}

/* ---------- free layout (desktop/tablet) ---------- */
const CW = 340, SMIN = .4, SMAX = 3, GAP = 12, prevH = {};
const freeMQ = matchMedia("(min-width:700px)");
function isFree(){ return freeMQ.matches; }
function colCount(){ return Math.max(1, Math.floor((board.clientWidth + GAP) / (CW + GAP))); }
function cards(){ return [...board.querySelectorAll("[data-card]")]; }
const sOf = p => (p && p.s) || 1;
const wOf = p => Math.round(CW * sOf(p));
/* resizing scales the whole block like a zoom (same proportions): the grey box always hugs its content */
function applySize(c, p){
  const inner = c.querySelector(".inner"), sc = sOf(p);
  c.style.width = wOf(p) + "px";
  if(sc === 1){ inner.style.transform = inner.style.width = ""; c.style.height = ""; return; }
  inner.style.width = (CW - 2) + "px";
  inner.style.transform = `scale(${sc})`;
  c.style.height = Math.ceil(inner.offsetHeight * sc + 5) + "px";   // + top/bottom borders
}
function layout(){
  const free = isFree();
  board.classList.toggle("free", free);
  document.getElementById("alignBtn").hidden = !free;
  if(!free){ cards().forEach(c=>{ c.style.left = c.style.top = c.style.zIndex = c.style.width = c.style.height = ""; const i = c.querySelector(".inner"); i.style.transform = i.style.width = ""; }); board.style.height = ""; return; }
  const ids = new Set(cards().map(c=>c.dataset.card));
  for(const k in S.pos) if(!ids.has(k)) delete S.pos[k];
  cards().forEach(c=>applySize(c, S.pos[c.dataset.card]));
  // place cards that have no position yet in the shortest column
  const nCols = colCount(), bottoms = Array(nCols).fill(0);
  cards().filter(c=>S.pos[c.dataset.card]).forEach(c=>{
    const p = S.pos[c.dataset.card], h = c.offsetHeight, w = wOf(p);
    for(let k=0;k<nCols;k++){ const cx = k*(CW+GAP); if(p.x < cx+CW && p.x+w > cx) bottoms[k] = Math.max(bottoms[k], p.y + h + GAP); }
  });
  let changed = false;
  cards().forEach(c=>{
    const id = c.dataset.card;
    if(!S.pos[id]){
      let k = 0; for(let j=1;j<nCols;j++) if(bottoms[j] < bottoms[k]) k = j;
      S.pos[id] = {x:k*(CW+GAP), y:bottoms[k], z:++S.ztop};
      applySize(c, S.pos[id]);
      bottoms[k] += c.offsetHeight + GAP; changed = true;
    }
  });
  // a block that grew (players added / resized taller) pushes down the blocks just below it instead of covering them
  const items = cards().map(c=>({id:c.dataset.card, c, h:c.offsetHeight, p:S.pos[c.dataset.card]}));
  const overlapX = (a,b)=> a.p.x < b.p.x + wOf(b.p) && b.p.x < a.p.x + wOf(a.p);
  const push = (a, oldBottom, depth)=>{
    if(depth > 40) return;
    const need = a.p.y + a.h + GAP;
    items.forEach(b=>{
      if(b===a || !overlapX(a,b)) return;
      if(b.p.y >= oldBottom - 2 && b.p.y < need){ const ob = b.p.y + b.h + GAP; b.p.y = need; changed = true; push(b, ob, depth+1); }
    });
  };
  if(!(cdrag && cdrag.on) && !rdrag) items.slice().sort((a,b)=>a.p.y-b.p.y).forEach(a=>{
    const old = prevH[a.id];
    if(old != null && a.h > old) push(a, a.p.y + old + GAP, 0);
  });
  items.forEach(a=>{ prevH[a.id] = a.h; });
  if(changed) save();
  let maxB = 0;
  cards().forEach(c=>{
    const p = S.pos[c.dataset.card];
    c.style.left = Math.max(0, Math.min(p.x, board.clientWidth - wOf(p))) + "px"; c.style.top = p.y + "px"; c.style.zIndex = p.z || 1;
    maxB = Math.max(maxB, p.y + c.offsetHeight);
  });
  board.style.height = (maxB + 160) + "px";
}
/* Align: each block snaps to its nearest column, then stacks cleanly by vertical order.
   Columns take the width of their widest block, so resized blocks line up too. */
function align(){
  if(!isFree()) return;
  snap();
  const nCols = Math.max(colCount(), 1), cols = Array.from({length:nCols}, ()=>[]);
  cards().forEach(c=>{
    const p = S.pos[c.dataset.card] || {x:0,y:0};
    const k = Math.max(0, Math.min(nCols-1, Math.round(p.x / (CW+GAP))));
    cols[k].push({c, p});
  });
  let x = 0;
  cols.forEach(list=>{
    if(!list.length) return;
    list.sort((a,b)=>a.p.y-b.p.y || a.p.x-b.p.x);
    let y = 0, colW = 0;
    list.forEach(({c})=>{ const id = c.dataset.card; S.pos[id] = Object.assign({}, S.pos[id], {x, y}); y += c.offsetHeight + GAP; colW = Math.max(colW, wOf(S.pos[id])); });
    x += colW + GAP;
  });
  board.classList.add("anim"); layout(); save(); undoBtn.disabled = false;
  setTimeout(()=>board.classList.remove("anim"), 300);
}
/* resize a block from its bottom-right corner (double-click the corner = default size) */
let rdrag = null;
board.addEventListener("pointerdown", e=>{
  const r = e.target.closest(".resizer"); if(!r || !isFree() || e.button > 0) return;
  e.preventDefault(); e.stopPropagation();
  const card = r.closest("[data-card]");
  rdrag = {card, id:card.dataset.card, x0:e.clientX, y0:e.clientY, s0:sOf(S.pos[card.dataset.card]), nat:card.querySelector('.inner').offsetHeight + 5, on:false, pid:e.pointerId};
});
addEventListener("pointermove", e=>{
  if(!rdrag || e.pointerId!==rdrag.pid) return;
  const dx = e.clientX-rdrag.x0, dy = e.clientY-rdrag.y0;
  if(!rdrag.on){
    if(Math.hypot(dx,dy) < 3) return;
    rdrag.on = true; snap(); undoBtn.disabled = false; closeMenu();
    const p = S.pos[rdrag.id]; p.z = ++S.ztop; rdrag.card.style.zIndex = S.ztop; rdrag.card.classList.add("lifted");
    document.body.style.userSelect = "none";
  }
  e.preventDefault();
  const p = S.pos[rdrag.id];
  // follow whichever direction the mouse moved the most (proportional zoom)
  const sw = (CW*rdrag.s0 + dx) / CW, sh = (rdrag.nat*rdrag.s0 + dy) / rdrag.nat;
  let sc = Math.abs(sw - rdrag.s0) >= Math.abs(sh - rdrag.s0) ? sw : sh;
  sc = Math.max(SMIN, Math.min(SMAX, (board.clientWidth - p.x) / CW, sc));
  p.s = Math.round(sc * 100) / 100; if(p.s === 1) delete p.s;
  applySize(rdrag.card, p);
  const need = p.y + rdrag.card.offsetHeight + 160; if(need > board.offsetHeight) board.style.height = need + "px";
}, {passive:false});

  if(!rdrag || (e && e.pointerId!==rdrag.pid)) return;
  const d = rdrag; rdrag = null;
  if(!d.on) return;

/* ---------- live countdown ---------- */
const beeped = new Set();
function tick(force){
  const now = Date.now();
  const utc = fmtUTC(now); document.getElementById("clock").textContent = "UTC " + utc;
  board.querySelectorAll("[data-utc]").forEach(el=>{ if(el.textContent!==utc) el.textContent = utc; });
  let anyRun = false;
  S.teams.forEach(tm=>{
    const card = board.querySelector(`[data-tid="${tm.id}"]`); if(!card) return;
    const st = card.querySelector(".status");
    const sc = schedule(tm);
    if(!tm.start){
      if(force){ const ch = jump.querySelector(`[data-chip="${tm.id}"]`); if(ch){ ch.textContent = ""; ch.parentNode.classList.remove("hot","soon"); } }
      if(force){ st.className="status"; st.innerHTML = `<span>${esc(t("rally"))} ${fmt(tm.rally)} + ${esc(t("march"))} ${fmt(sc.max)}</span><b>= ${fmt(sc.total)}</b>`; }
      return;
    }
    anyRun = true;
    const land = tm.start + sc.total*1000, toLand = (land-now)/1000, toFirst = (tm.start-now)/1000;
    if(toLand < -20){ tm.start = null; save(); render(); return; }
    if(toLand <= 0){ st.className="status landed"; st.innerHTML = `<span>🏰</span><b>${esc(t("landed"))}</b>`; }
    else if(toFirst > 0){ st.className="status"; st.innerHTML = `<span>${esc(t("firstIn"))}</span><b>${fmtClock(toFirst)}</b>`; }
    else { st.className="status"; st.innerHTML = `<span>${esc(t("landsIn"))}</span><b>${fmtClock(toLand)}</b>`; }
    let nextLi = null, nextRem = Infinity;
    card.querySelectorAll(".cd").forEach(el=>{
      const off = +el.dataset.off, rem = (tm.start + off*1000 - now)/1000;
      const pid = el.closest("li").dataset.pid;
      let cls, txt;
      if(rem > 10){ cls="cd"; txt=fmtClock(rem); }
      else if(rem > 5){ cls="cd soon"; txt=fmtClock(rem); }
      else if(rem > 0){ cls="cd hot"; txt=fmtClock(rem); }
      else if(rem > -3){ cls="cd now"; txt=t("launch"); }
      else { cls="cd done"; txt="✓"; }
      const li = el.closest("li");
      if(rem > -0.5 && rem < nextRem){ nextRem = rem; nextLi = li; }
      li.classList.toggle("gone", rem <= -3);
      if(el.className!==cls) el.className = cls;
      if(el.textContent!==txt) el.textContent = txt;
      // beeps: 3,2,1 then launch
      const sec = Math.ceil(rem);
      if(rem > -0.5 && sec <= 5 && sec >= 0){
        const k = `${tm.id}:${tm.start}:${pid}:${sec}`;
        if(!beeped.has(k)){ beeped.add(k); beep(sec===0 ? 1046 : 660, sec===0 ? .35 : .09); if(S.sound && navigator.vibrate) try{ navigator.vibrate(sec===0 ? [250,80,250] : 60); }catch(e){} }
      }
    });
    card.querySelectorAll("li.player").forEach(li=>li.classList.toggle("next", li===nextLi));
    const chip = jump.querySelector(`[data-chip="${tm.id}"]`);
    if(chip){
      const txt = nextRem < Infinity ? (nextRem > 0 ? fmtClock(nextRem) : "GO!") : toLand > 0 ? "🏰 " + fmtClock(toLand) : "✓";
      if(chip.textContent !== txt) chip.textContent = txt;
      const cl = chip.parentNode.classList; cl.toggle("hot", nextRem <= 5 && nextRem < Infinity); cl.toggle("soon", nextRem > 5 && nextRem <= 10);
    }
  });
  if(beeped.size > 2000) beeped.clear();
  wake(anyRun);
}
setInterval(tick, 100);

/* ---------- audio & wake lock ---------- */
let actx = null;
function beep(freq, dur){
  if(!S.sound) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = freq; o.type = "square";
    g.gain.setValueAtTime(.12, actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+dur+.02);
  }catch(e){}
}
let lock = null, wantLock = false;
async function wake(on){
  if(on===wantLock && (!on || lock)) return;
  wantLock = on;
  try{
    if(on && !lock && navigator.wakeLock && document.visibilityState==="visible"){ lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release",()=>{lock=null;}); }
    if(!on && lock){ await lock.release(); lock=null; }
  }catch(e){}
}

/* ---------- actions ---------- */
function goTeam(tm, extraDelay){ tm.start = Date.now() + (S.lead + (extraDelay||0))*1000; }
function goAll(baseMs){
  const teams = S.teams.filter(x=>x.players.length); if(!teams.length) return;
  const maxTotal = Math.max(...teams.map(x=>schedule(x).total));
  const base = typeof baseMs === "number" ? baseMs : Date.now() + S.lead*1000;
  // every team lands at the same instant; the slowest team launches first, at "base"
  teams.forEach(x=>{ x.start = base + (maxTotal - schedule(x).total)*1000; });
  actx && actx.resume && actx.resume(); beep(880,.05);
  save(); render();
}
function stopAll(){ S.teams.forEach(x=>x.start=null); save(); render(); }

function addPlayers(dest, input){
  const {out,bad} = parseRoster(input.value);
  if(!out.length){ if(bad.length) toast(t("badTime")); return; }
  mutate(()=>{ const list = listOf(dest); out.forEach(o=>list.push({id:uid("p"), name:o.name, march:o.march})); });
  const el = board.querySelector(`[data-add="${dest}"]`); if(el){ el.value = bad.join(", "); el.focus(); }
  if(bad.length) toast(t("badTime"));
}
function copyTeam(tm, i){
  const sc = schedule(tm);
  const lines = [`⚔️ ${tm.alliance?`[${tm.alliance}] `:""}${teamName(tm,i)} — ${t("rally")} ${fmt(tm.rally)}`];
  if(tm.start){
    lines[0] += ` — ${t("landAt")} ${fmtUTC(tm.start + sc.total*1000)} UTC`;
    sc.rows.forEach((r,k)=>lines.push(`${k+1}. ${r.p.name} — ${fmtUTC(tm.start + r.off*1000)} UTC`));
  } else sc.rows.forEach((r,k)=>lines.push(`${k+1}. ${r.p.name} — ${r.off===0?"GO":"+"+fmt(r.off)}`));
  const txt = lines.join("\n");
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast(t("copied")), ()=>{ ask("📋", txt, "text"); });
}

function toast(msg, withUndo){
  const el = document.getElementById("toast"); el.textContent = msg;
  if(withUndo){ const b = document.createElement("button"); b.textContent = "↶ " + t("undo"); b.onclick = ()=>{ undo(); el.classList.remove("show"); }; el.appendChild(b); }
  el.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(()=>el.classList.remove("show"), withUndo ? 5000 : 1800);
}
/* in-page replacement for prompt()/confirm() — native dialogs are blocked in some browsers/previews */
const askDlg = document.getElementById("ask"), askIn = document.getElementById("askIn"), askTa = document.getElementById("askTa");
let askResolve = null;
function ask(msg, value, mode){
  if(askResolve) askResolve(null);
  document.getElementById("askMsg").textContent = msg;
  askIn.hidden = mode==="confirm" || mode==="text"; askTa.hidden = mode!=="text";
  askIn.value = value ?? ""; askTa.value = mode==="text" ? value : "";
  document.getElementById("askCancel").hidden = mode==="text";
  askDlg.showModal();
  setTimeout(()=>{ const f = mode==="text" ? askTa : askIn.hidden ? document.getElementById("askOk") : askIn; f.focus(); f.select && f.select(); }, 0);
  return new Promise(res=>{ askResolve = res; });
}
function askDone(ok){
  const r = askResolve; askResolve = null; if(askDlg.open) askDlg.close();
  if(r) r(ok ? (askIn.hidden ? true : askIn.value) : null);
}
document.getElementById("askForm").addEventListener("submit", e=>{ e.preventDefault(); askDone(true); });
document.getElementById("askCancel").onclick = ()=>askDone(false);
askDlg.addEventListener("cancel", e=>{ e.preventDefault(); askDone(false); });

/* sync across tabs (e.g. second screen) */
addEventListener("storage", e=>{ if(e.key===KEY){ const s = load(); if(s){ S = s; render(); } } });
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible"){ lock=null; wantLock=false; } });

render();
</script>
</body>
</html>
