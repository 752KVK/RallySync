<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>752 HOME</title>
<meta name="description" content="752 HOME: tools for the 752 leaders (RallySync, KvK PLAN, Battle Roster) and FUN for the whole server. Unofficial fan-made site, not affiliated with Kingshot or its publisher.">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="752 HOME">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<style>
:root{
  --bg:#0f1115; --panel:#181b22; --panel2:#20242d; --line:#2c313c; --text:#e8eaf0; --muted:#8b93a5;
  --accent:#f5b83d; --go:#2ecc71; --warn:#f39c12; --danger:#e74c3c; --drop:#f5b83d33; --shadow:0 8px 30px #0008;
  color-scheme: dark;
}
:root[data-theme="light"]{
  --bg:#f3f4f7; --panel:#ffffff; --panel2:#f0f2f6; --line:#dde1e8; --text:#161922; --muted:#646c7c;
  --accent:#c98a00; --go:#1e9e55; --warn:#d07b00; --danger:#d0362a; --drop:#c98a0022; --shadow:0 8px 30px #0002;
  color-scheme: light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--text);font:15px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans KR",sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);border-radius:8px;padding:6px 10px}
button:hover{border-color:var(--muted)}
button:disabled{opacity:.4;cursor:default}
input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-width:0}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}

header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.brand{font-weight:800;letter-spacing:.3px;margin-right:auto;display:flex;align-items:baseline;gap:8px}
.brand small{color:var(--muted);font-weight:500}
.clock{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.btn-go{background:var(--go);border-color:var(--go);color:#fff;font-weight:800}
.btn-stop{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:700}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;border-radius:0;padding:5px 8px;background:transparent}
.seg button.on{background:var(--accent);color:#111;font-weight:700}

.hint{color:var(--muted);font-size:12px;padding:6px 12px}
main.free{display:block;position:relative;z-index:0;padding:0;margin:0 12px;min-height:calc(100vh - 110px)}
main.free .card{position:absolute;width:340px;left:0;top:0;display:flex;flex-direction:column}
main.free .card{overflow:hidden}
main.free .card .inner{transform-origin:0 0}
main.free.anim .card .inner{transition:transform .25s ease}
.resizer{display:none}
main.free .resizer{display:block;position:absolute;right:0;bottom:0;width:20px;height:20px;cursor:nwse-resize;touch-action:none;border-bottom-right-radius:12px;
  background:linear-gradient(135deg,transparent 0 55%,var(--muted) 55% 60%,transparent 60% 70%,var(--muted) 70% 75%,transparent 75%);opacity:.6}
main.free .resizer:hover{opacity:1}
main.free .thead{cursor:move;touch-action:none;user-select:none}
main.free .thead .tname{cursor:move}
main.free.anim .card{transition:left .25s ease,top .25s ease,width .25s ease}
.card.lifted{box-shadow:var(--shadow),0 0 0 2px var(--c);opacity:.97}
.grip{color:var(--muted);font-size:13px;letter-spacing:-2px;margin-right:2px}
main:not(.free) .grip{display:none}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;padding:0 12px 120px;align-items:start}

.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;border-top:4px solid var(--c,var(--muted));transition:box-shadow .12s,border-color .12s}
.card.drop-on{box-shadow:0 0 0 3px var(--accent) inset;background:linear-gradient(var(--drop),var(--drop)),var(--panel)}
.card.bench{--c:var(--muted)}
.card.running{box-shadow:0 0 0 1px var(--c)}
.thead{display:flex;gap:6px;align-items:center;padding:8px 10px 4px}
.tname{font-weight:800;font-size:16px;flex:0 1 auto;margin-right:auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:text}
.tname[data-act=rename]{margin-right:0}
.ally{margin-right:auto;width:64px;min-width:44px;max-width:120px;padding:1px 6px;font-size:12px;font-weight:700;border-radius:6px;border:1px solid transparent;background:transparent;color:var(--c);text-transform:none}
.ally:hover{border-color:var(--line)}
.ally:placeholder-shown{border:1px dashed var(--line);color:var(--muted)}
.ally::placeholder{color:var(--muted);font-weight:500}
.cdot{position:relative;width:14px;height:14px;border-radius:50%;background:var(--c);flex:none;cursor:pointer;box-shadow:0 0 0 2px var(--panel),0 0 0 3px var(--line)}
.cdot input{position:absolute;inset:0;opacity:0;width:100%;height:100%;padding:0;border:0;cursor:pointer}
.tnum{background:var(--c);color:#111;font-weight:800;border-radius:6px;padding:0 6px;font-size:12px}
.icon{padding:4px 7px;background:transparent;border-color:transparent;color:var(--muted)}
.icon:hover{color:var(--text);border-color:var(--line)}
.trow{display:flex;gap:6px;align-items:center;padding:2px 10px 8px;flex-wrap:wrap}
.trow label{color:var(--muted);font-size:12px}
.rally-in{width:58px;text-align:center}
.status{margin:0 10px 8px;padding:6px 10px;border-radius:8px;background:var(--panel2);font-variant-numeric:tabular-nums;display:flex;justify-content:space-between;gap:8px;font-size:14px}
.status b{font-size:18px}
.status.landed{background:var(--go);color:#fff}

ul.players{list-style:none;margin:0;padding:0 6px 6px;min-height:44px}
.empty{color:var(--muted);text-align:center;font-size:13px;padding:12px;border:1px dashed var(--line);border-radius:8px;margin:4px}
li.player{display:grid;grid-template-columns:18px minmax(50px,1fr) 58px 72px 26px 22px;gap:4px;align-items:center;padding:4px;border-radius:8px}
li.player.next{background:var(--panel2);box-shadow:inset 3px 0 0 var(--c)}
li.player.gone{opacity:.45}
.march.unset{border-color:var(--warn);color:var(--warn)}
li.player:hover{background:var(--panel2)}
li.player.ghost-src{opacity:.35}
.handle{cursor:grab;color:var(--muted);text-align:center;touch-action:none;user-select:none;font-size:18px;line-height:1}
.pname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;touch-action:none;user-select:none;cursor:grab}
.pname .star{color:var(--accent);margin-left:4px;font-size:12px}
.march{width:100%;text-align:center;font-variant-numeric:tabular-nums;padding:4px}
.march.bad{border-color:var(--danger)}
.cd{text-align:right;width:100%;font-variant-numeric:tabular-nums;font-weight:700;border-radius:6px;padding:3px 6px;white-space:nowrap}
.cd.idle{color:var(--muted);font-weight:600}
.cd.soon{color:var(--warn)}
.cd.hot{background:var(--danger);color:#fff;animation:pulse .5s infinite alternate}
.cd.now{background:var(--go);color:#fff;text-align:center}
.cd.done{color:var(--go)}
@keyframes pulse{to{opacity:.65}}
.addrow{display:flex;gap:6px;padding:4px 10px 10px}
.when{display:flex;flex-direction:column;align-items:flex-end;line-height:1.15}
.abs{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;padding-right:6px}
.utcrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 10px 6px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.utcrow>span{white-space:nowrap}
.utcrow b{color:var(--text);font-size:15px}
.planbtn{padding:4px 9px;font-size:13px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.planbtn.on{color:var(--accent);border-color:var(--accent)}
.utcclock{font-variant-numeric:tabular-nums;font-weight:700;padding:5px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.addrow input{flex:1}

.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:100;background:var(--panel);border:1px solid var(--accent);box-shadow:var(--shadow);opacity:.95;border-radius:8px}
.menu{position:fixed;z-index:110;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:170px;max-height:70vh;overflow:auto}
.menu .mt{color:var(--muted);font-size:12px;padding:2px 6px}
.menu button{text-align:left;display:flex;gap:8px;align-items:center}
.langbtn{font-weight:700;white-space:nowrap}
.langmenu{z-index:800;min-width:160px}
.langmenu button.on{border-color:var(--accent);color:var(--accent)}
.langmenu button .lc{margin-left:auto;color:var(--muted);font-size:12px}
.menu .sepm{height:1px;background:var(--line);margin:2px 0}
.menu .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:200;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1;pointer-events:auto}
.toast button{margin-left:10px;background:var(--accent);border-color:var(--accent);color:#111;font-weight:700;padding:3px 10px}
#ask p{margin:0 0 10px}
#ask input,#ask textarea{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px}
#ask .row{justify-content:flex-end}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:12px;max-width:420px;width:92vw}
dialog::backdrop{background:#0008}
dialog .row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:10px 0}
dialog h3{margin:0 0 6px}
.vol{width:140px;accent-color:var(--accent);padding:0}
.about{color:var(--muted);font-size:12px;margin:10px 0 0;line-height:1.4}
.sep{width:1px;align-self:stretch;background:var(--line)}
.jump{display:none}
@media (max-width:699px){
  header{gap:5px;padding:6px;padding-top:max(6px,env(safe-area-inset-top));padding-left:max(6px,env(safe-area-inset-left));padding-right:max(6px,env(safe-area-inset-right))}
  .hide-sm,.hide-xs,.hint{display:none !important}
  .brand{margin-right:0;font-size:18px}
  .utcclock{margin-right:auto;font-size:13px;padding:8px 7px}
  header>button{padding:8px 9px;min-height:38px;font-size:13px}
  #addTeam,#undo,#settingsBtn,#lockTop{min-width:36px;padding:8px 5px}
  main{grid-template-columns:1fr;gap:10px;padding:8px 8px calc(60vh + env(safe-area-inset-bottom))}
  .card{scroll-margin-top:calc(var(--hh,110px) + 8px)}
  /* team quick-jump bar with live next-launch countdown */
  .jump{display:flex;gap:6px;overflow-x:auto;width:100%;scrollbar-width:none;padding:2px 0 0}
  .jump::-webkit-scrollbar{display:none}
  .chip{flex:none;display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-weight:700;font-size:14px;min-height:34px}
  .chip .dot{width:10px;height:10px;border-radius:50%;background:var(--c)}
  .chip small{font-variant-numeric:tabular-nums;font-weight:800}
  .chip.soon small{color:var(--warn)}
  .chip.hot{background:var(--danger);border-color:var(--danger);color:#fff;animation:pulse .5s infinite alternate}
  .chip.hot small{color:#fff}
  /* bigger touch targets, 16px inputs (stops iOS auto-zoom) */
  input,.march,.ally,#ask input,#ask textarea{font-size:16px}
  .addrow input{padding:9px 10px}
  .addrow button{min-width:44px}
  .seg button{padding:7px 9px}
  .trow{gap:8px}
  .btn-go,.btn-stop{min-height:38px;padding:7px 14px}
  .icon{min-width:34px;min-height:34px;font-size:16px}
  .tname{font-size:17px}
  .ally{font-size:16px}
  .cdot{width:22px;height:22px}
  li.player{grid-template-columns:26px minmax(0,1fr) 64px 76px 36px 32px;gap:3px;padding:6px 2px;min-height:48px}
  .handle{font-size:24px;padding:6px 0}
  .pname{touch-action:pan-y;cursor:default;font-size:16px}
  .march{padding:7px 2px}
  .cd{font-size:17px}
  .cd.now{font-size:14px}
  .status{font-size:15px}
  .status b{font-size:22px}
  .menu button{padding:10px 12px;font-size:16px}
  .toast{bottom:calc(18px + env(safe-area-inset-bottom))}
}

/* ================= casino door ================= */
#gate{display:none}
html.locked{overflow:hidden}
html.locked body>*:not(#gate):not(.toast):not(dialog):not(.langmenu){visibility:hidden}
html.picking{overflow:hidden}
html.picking body>*:not(#gate):not(#sessions):not(#hub):not(.toast):not(dialog):not(.langmenu){visibility:hidden}
html.locked #sessions{visibility:hidden}
#sessions{display:none}
#hub{display:none}
html.hub #hub{display:flex}
html.hub{overflow:hidden}
html.hub body>*:not(#gate):not(#hub):not(.toast):not(dialog):not(.langmenu){visibility:hidden}
html.locked #hub{visibility:hidden}
#hub{position:fixed;inset:0;z-index:455;flex-direction:column;align-items:center;justify-content:center;overflow:auto;padding:70px 14px 40px;color:#fff;
  background:radial-gradient(ellipse at 50% 20%, #1f7a4a 0%, #0f4f2e 45%, #062417 80%, #03130c 100%)}
.hub-box{display:flex;flex-direction:column;gap:14px}
.hub-box .ss-sub{margin-bottom:10px}
.hub-btn{display:flex;align-items:center;gap:16px;width:100%;padding:18px 20px;border-radius:16px;border:0;cursor:pointer;text-align:left;color:#fff;
  box-shadow:0 5px 0 #0008,0 14px 28px #0007;transition:transform .08s,filter .15s}
.hub-btn:hover{filter:brightness(1.08)}
.hub-btn:active{transform:translateY(4px);box-shadow:0 1px 0 #0008,0 6px 14px #0006}
.hub-btn .hb-ic{font-size:36px;line-height:1;flex:none;filter:drop-shadow(0 2px 3px #0008)}
.hub-btn .hb-txt{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}
.hub-btn .hb-txt b{font-size:22px;font-weight:900;letter-spacing:1.5px;text-shadow:0 2px 4px #0007}
.hub-btn .hb-txt small{font-size:13px;font-weight:600;opacity:.85}
.hub-btn .hb-lock{font-size:18px;opacity:.8;flex:none}
.hb-rally{background:linear-gradient(180deg,#2fbf71,#13804a 55%,#0b5c34)}
.hb-plan{background:linear-gradient(180deg,#ffe58a,#e0ac2b 50%,#a8780e);color:#2a1a00}
.hb-plan .hb-txt b{text-shadow:none}
.hb-roster{background:linear-gradient(180deg,#ff6b78,#c42737 55%,#86101d)}
.hb-fun{background:linear-gradient(180deg,#b06bff,#6a2bd1 55%,#3d1388)}

.hub-main{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hub-big{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-height:250px;padding:24px 16px 20px;border-radius:22px;border:0;cursor:pointer;color:#fff;text-align:center;
  box-shadow:0 6px 0 #0008,0 16px 34px #0008;transition:transform .12s,filter .15s;overflow:hidden;font:inherit}
.hub-big::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% -10%,#ffffff40,transparent 62%);pointer-events:none}
.hub-big:hover{filter:brightness(1.1);transform:translateY(-3px)}
.hub-big:active{transform:translateY(4px);box-shadow:0 1px 0 #0008,0 6px 14px #0006}
.hub-big:focus-visible,.hub-btn:focus-visible,.hub-ah button:focus-visible{outline:3px solid #ffd56a;outline-offset:3px}
.hbb-ic{font-size:60px;line-height:1;filter:drop-shadow(0 4px 6px #000a);transition:transform .2s}
.hub-big:hover .hbb-ic{transform:scale(1.08) rotate(-4deg)}
.hbb-txt{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.hbb-txt b{font-size:27px;font-weight:900;letter-spacing:2px;text-shadow:0 2px 6px #0009;white-space:nowrap}
.hbb-txt small{font-size:13px;font-weight:600;opacity:.92;line-height:1.35}
.hbb-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px;margin-top:4px}
.hbb-tag{font-size:11px;font-weight:800;padding:4px 10px;border-radius:999px;background:#0006;border:1px solid #fff5;letter-spacing:.4px;white-space:nowrap}
.hbb-tools{font-size:19px;letter-spacing:3px;filter:drop-shadow(0 2px 2px #0008)}
.hbb-go{display:none;font-size:30px;font-weight:300;opacity:.7;flex:none}
.hb-admin{background:linear-gradient(160deg,#454b72,#23284a 50%,#11132a);box-shadow:inset 0 0 0 2px #e8b84a,0 6px 0 #0008,0 16px 34px #0008}
.hb-admin .hbb-txt b{color:#ffd56a}
.hub-admin{display:flex;flex-direction:column;gap:14px;animation:hubIn .28s cubic-bezier(.2,.8,.3,1)}
.hub-main{animation:hubIn .28s cubic-bezier(.2,.8,.3,1)}
.hub-admin[hidden],.hub-main[hidden]{display:none}
@keyframes hubIn{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.hub-ah{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.hub-ah button{padding:8px 16px;border-radius:999px;border:1px solid #fff6;background:#000a;color:#fff;font:inherit;font-weight:800;cursor:pointer}
.hub-ah button:hover{background:#000d;border-color:#ffd56a}
.hub-ah b{font-size:18px;letter-spacing:1.5px;color:#ffd56a;text-shadow:0 2px 6px #000}
.hub-btn{position:relative}
.hb-last{position:absolute;top:-10px;right:16px;font-size:11px;font-weight:900;padding:2px 10px;border-radius:999px;background:#ffd56a;color:#3a2600;box-shadow:0 2px 6px #0008;letter-spacing:.3px}
.hb-lock.open{opacity:1;filter:drop-shadow(0 0 4px #7dff9a)}
#hubAdminBox .hb-lock{display:none}
.hub-bk{align-self:center;padding:9px 18px;border-radius:999px;border:1px solid #ffd56a88;background:#000b;color:#ffd56a;font:inherit;font-weight:800;cursor:pointer}
.hub-bk:hover{background:#000d;border-color:#ffd56a}
.bk-box{position:fixed;inset:0;z-index:470;display:flex;align-items:center;justify-content:center;padding:12px;background:#000a}
.bk-card{width:min(520px,100%);max-height:92vh;overflow:auto;padding:18px;border-radius:16px;background:#14182c;color:#fff;box-shadow:0 18px 50px #000c;border:1px solid #ffd56a55}
.bk-card h4{margin:0 0 6px;font-size:18px;color:#ffd56a}.bk-card h5{margin:16px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:#f6e6b0}
.bk-card p{margin:4px 0;font-size:13px;opacity:.85;line-height:1.4}
.bk-card button{font:inherit;font-weight:800;border-radius:10px;padding:9px 12px;border:1px solid #fff3;background:#ffffff14;color:#fff;cursor:pointer}
.bk-card button:hover{background:#ffffff26}
.bk-card .pri{background:#2e9d4f;border-color:#2e9d4f}.bk-card .warn{background:#c62828;border-color:#c62828}
.bk-row{display:flex;align-items:center;gap:8px;padding:8px 10px;margin:4px 0;border-radius:10px;background:#ffffff0d;font-size:13px}
.bk-row span{flex:1;min-width:0}.bk-row small{opacity:.7}
.bk-chk{display:flex;flex-direction:column;gap:6px;margin:8px 0}.bk-chk label{display:flex;gap:8px;align-items:center;font-size:14px}
.bk-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.hub-note{margin:2px 0 0;text-align:center;font-size:12px;color:#f6e6b0;text-shadow:0 2px 6px #000}
@media (prefers-reduced-motion:reduce){ .hub-admin,.hub-main{animation:none} .hub-big,.hbb-ic{transition:none} }
@media (max-width:599px){
  .hub-main{grid-template-columns:1fr;gap:14px}
  .hub-big{flex-direction:row;justify-content:flex-start;text-align:left;min-height:0;padding:18px 16px;gap:14px}
  .hbb-ic{font-size:44px}
  .hbb-txt{align-items:flex-start;flex:1}
  .hbb-txt b{font-size:22px}
  .hbb-row{justify-content:flex-start}
  .hbb-go{display:block}
}
.ss-back{position:fixed;top:max(12px,env(safe-area-inset-top));left:12px;z-index:2}
@media (max-width:699px){ #hub{justify-content:flex-start;padding-top:64px} .hub-btn{padding:16px} .hub-btn .hb-txt b{font-size:19px} }
html.picking #sessions{display:flex}
#sessions{position:fixed;inset:0;z-index:450;flex-direction:column;align-items:center;overflow:auto;padding:70px 14px 40px;color:#fff;
  background:radial-gradient(ellipse at 50% 20%, #1f7a4a 0%, #0f4f2e 45%, #062417 80%, #03130c 100%)}
.ss-top{position:fixed;top:max(12px,env(safe-area-inset-top));right:12px;display:flex;gap:6px;z-index:2}
.ss-btn{background:#0006 !important;border:1px solid #d4af3766 !important;color:#f6e7b0 !important;border-radius:8px;padding:6px 10px;font-size:14px;font-weight:700}

.g-lang{position:absolute;top:max(12px,env(safe-area-inset-top));right:12px;display:flex;gap:4px;z-index:2}

.g-langbtn{background:#0006 !important;border:1px solid #d4af3766 !important;color:#f6e7b0 !important;border-radius:8px;padding:6px 10px;font-size:14px;font-weight:700}
.g-sign{position:relative;text-align:center;line-height:1}

.g-wrap{position:relative;display:flex;align-items:center;gap:6px}

.g-lights i:nth-child(even){animation-delay:.5s}
@keyframes bulb{50%{background:#5a4100;box-shadow:none}}
#gate.win .g-lights i{animation-duration:.18s}
.g-top{text-align:center;font-weight:900;color:#ffe9a8;font-size:15px;letter-spacing:4px;margin-bottom:10px;text-shadow:0 2px 0 #0008}

.g-strip.blur{filter:blur(1.5px)}
.g-pass{display:flex;align-items:center;gap:8px;margin-top:12px;padding:6px 8px 6px 12px;border-radius:12px;
  background:linear-gradient(#1a0004,#0b0002);box-shadow:inset 0 0 0 2px #d4af37,inset 0 6px 14px #000}
.g-key{font-size:18px}
#gPass{flex:1;min-width:0;background:transparent;border:0;outline:none;color:#ffe9a8;font-size:20px;font-weight:800;letter-spacing:3px;padding:8px 0;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;text-shadow:0 0 8px #ffbf0080}
#gPass::placeholder{color:#ffe9a873;letter-spacing:1px;font-weight:600;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;text-shadow:none}
.g-pass:focus-within{box-shadow:inset 0 0 0 2px #ffd34d,0 0 16px #ffbf0066,inset 0 6px 14px #000}
.g-eye{background:transparent;border:0;font-size:18px;padding:4px 6px;opacity:.7;cursor:pointer}
.g-eye.on{opacity:1}
.g-strip .s7{color:#d40000;font-style:italic;text-shadow:0 2px 0 #7a0000,0 0 6px #ff000040}
.g-strip .sbar{font-size:calc(var(--ch)*.3);font-style:normal;color:#fff;background:#111;padding:2px 8px;border-radius:6px;height:auto;margin:auto;line-height:1.4;letter-spacing:1px}
.g-strip .sl{color:#d4a017;font-weight:900;text-shadow:0 2px 0 #7a5800,0 0 8px #ffbf0066;-webkit-text-stroke:1px #7a5800}
.g-strip .snoob{display:inline-block;transform:rotate(-8deg);font-size:calc(var(--ch)*.26);font-weight:900;letter-spacing:1px;line-height:1;color:#fff;
  background:linear-gradient(180deg,#9b59ff,#5b1fbf);padding:6px 7px;border-radius:9px;border:2px dashed #ffffffb0;box-shadow:0 3px 0 #2e0d66,0 0 0 2px #2e0d66}
.g-strip .sem{font-size:calc(var(--ch)*.5)}
.g-arrow{width:100%;background:#0005;border:1px solid #d4af3780;color:#ffe9a8;border-radius:8px;padding:2px 0;font-size:14px;line-height:1.3}
.g-arrow:active{background:#d4af37;color:#2a1a00}
.g-msg{min-height:26px;margin-top:12px;text-align:center;font-weight:900;font-size:18px;letter-spacing:1px;color:#ffe9a8}
.g-msg.lose{color:#ffb3b3}
.g-msg.win{color:#fff36b;text-shadow:0 0 12px #ffbf00;font-size:24px}
.g-spin{display:block;width:100%;margin-top:10px;padding:13px;border-radius:12px;border:0;font-size:20px;font-weight:900;letter-spacing:3px;color:#2a1a00;
  background:linear-gradient(180deg,#fff1a8,#f2c94c 45%,#c9971c);box-shadow:0 5px 0 #7a5800,0 10px 20px #0008;cursor:pointer}
.g-spin:active{transform:translateY(4px);box-shadow:0 1px 0 #7a5800}
.g-spin:disabled{filter:grayscale(.6);opacity:.7}
.g-lever{position:relative;width:34px;height:190px;cursor:grab;touch-action:none;flex:none}
.g-lever .rod{position:absolute;left:13px;top:22px;width:8px;height:150px;border-radius:4px;background:linear-gradient(90deg,#999,#eee,#888);transform-origin:50% 100%;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.g-lever .ball{position:absolute;left:0;top:0;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff8a8a,#d00 55%,#600);box-shadow:0 4px 10px #0009;transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.g-lever .base{position:absolute;left:5px;bottom:0;width:24px;height:30px;border-radius:6px;background:linear-gradient(#d4af37,#7a5800)}
.g-lever.pulled .rod{transform:scaleY(-.55)}
.g-lever.pulled .ball{transform:translateY(118px)}
.g-hint{font-size:12px;color:#d9f2e2b0;text-align:center;max-width:380px}
.g-cab.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.g-coin{position:fixed;top:-50px;z-index:600;font-size:30px;pointer-events:none;animation:coinfall linear forwards}
@keyframes coinfall{to{transform:translateY(115vh) rotate(720deg)}}
#gate.out{animation:gout .6s ease forwards}
@keyframes gout{to{opacity:0;transform:scale(1.06)}}
@media (max-width:480px){ .g-sign small{letter-spacing:2px;font-size:12px} .g-reels{--ch:66px} .g-lever{height:160px} .g-lever .rod{height:120px} .g-lever.pulled .ball{transform:translateY(92px)} }
@media (prefers-reduced-motion:reduce){ .g-sign h1,.g-lights i{animation:none} }

#plan{display:none}
html.planning{overflow:hidden}
html.planning body>*:not(#gate):not(#plan):not(.toast):not(dialog):not(.langmenu):not(.kp-menu):not(.kp-ghost){visibility:hidden}

html.planning #plan{display:flex}
html.planning .toast{z-index:480}
#plan{position:fixed;inset:0;z-index:440;flex-direction:column;background:var(--bg);color:var(--text)}
#ask p{white-space:pre-line}
.ss-plan{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin:0 0 16px;padding:12px 14px;border-radius:14px;border:0;cursor:pointer;
  font-size:17px;font-weight:900;letter-spacing:1px;color:#2a1a00;background:linear-gradient(180deg,#fff1a8,#f2c94c 45%,#c9971c);box-shadow:0 4px 0 #7a5800,0 10px 22px #0007}
.ss-plan:active{transform:translateY(3px);box-shadow:0 1px 0 #7a5800}
.ss-plan small{font-size:13px;font-weight:700;opacity:.75;letter-spacing:0}
.kp-bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.kp-bar2{gap:10px;padding:8px 12px}
.kp-title{font-size:16px;white-space:nowrap}
.kp-tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin;padding:2px}
.kp-tab{white-space:nowrap;font-weight:700;padding:5px 10px;border-radius:8px 8px 3px 3px}
.kp-tab.on{background:var(--accent);border-color:var(--accent);color:#111}
#kpSearch{width:150px;padding:6px 8px}
.kp-clanlbl{background:#2b447f;color:#fff;font-weight:800;font-family:Arial,sans-serif;padding:6px 12px;border-radius:3px;letter-spacing:.5px;white-space:nowrap}
.kp-clans{display:flex;flex-wrap:wrap;gap:8px}
.kp-clan{display:inline-flex;align-items:center;gap:6px;background:#edf2fc;color:#000;border:2px solid #2b447f;border-radius:3px;padding:3px 8px 3px 6px;font-family:Arial,sans-serif;cursor:pointer;user-select:none}
.kp-clan{color-scheme:light}
#plan .kp-clan input{all:revert;width:16px;height:16px;margin:0;accent-color:#2b447f;cursor:pointer}
.kp-clan b{font-size:15px}
.kp-clan small{font-size:11px;font-weight:700;color:#fff;background:var(--cc);border-radius:9px;padding:1px 6px;min-width:18px;text-align:center}
.kp-clan button{border:0;background:transparent;color:#2b447f;padding:0 2px;font-size:13px;opacity:.45}
.kp-clan:hover button,.kp-clan button:focus{opacity:1}
.kp-colors{display:flex;gap:5px;align-items:center}
.kp-sw{width:24px;height:24px;border-radius:5px;border:2px solid #0003;padding:0;background:var(--f)}
.kp-sw:hover{border-color:var(--text)}
#kpCC.on{background:var(--accent);border-color:var(--accent);color:#111}
.kp-hint{color:var(--muted);font-size:12px;margin-left:auto}
@media (max-width:1650px){ .kp-hint{display:none} }
.kp-warn{font-size:12px;padding:2px 8px;border-radius:10px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;cursor:help}
.kp-warn[hidden]{display:none}
.kp-view{flex:1;overflow:auto;padding:14px;-webkit-overflow-scrolling:touch}
.kp-wrap{--z:1;font-size:calc(16px*var(--z));position:relative;display:block;width:121.5625em;height:101.5625em;margin:0 auto;font-family:Arial,Helvetica,sans-serif}
.kp-wrap.loading{opacity:.35;pointer-events:none}
.kp-board{position:relative;display:grid;grid-template-columns:repeat(14,6.25em);grid-auto-rows:6.25em;gap:.9375em;padding:.9375em;background:#d9ead3;color:#000;user-select:none;-webkit-user-select:none}
.pt{position:relative;box-sizing:border-box;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1.5625em 1fr;background:#fff;border:.125em solid #b6b6b6;color:#000;overflow:hidden;cursor:pointer}
.pt.c-p{background:#f4cccc}.pt.c-y{background:#ffd966}.pt.c-b{background:#9ec3e7}.pt.c-g{background:#b6d7a8}.pt.c-o{background:#f9cb9c}.pt.c-v{background:#d9c2e9}.pt.c-k{background:#cccccc}

.pt:hover .pt-g:empty::before{opacity:.35}
#plan .pt-t{all:unset;box-sizing:border-box;align-self:center;line-height:1.3;font:inherit;font-size:.83em;font-weight:700;text-align:right;padding:0 .35em 0 0;width:100%;min-width:0;color:inherit;cursor:text}

.pt.cur{outline-width:.2em;box-shadow:0 0 0 .22em #1a73e833}
.pt.hit{box-shadow:0 0 0 .25em #ff6d00;z-index:3}
.pt.mv{outline:.2em dashed #d81b60;outline-offset:-.06em}
.pt[data-drop]{outline:.2em dashed #1a73e8;outline-offset:.1em;z-index:4}

.kp-red{position:absolute;inset:7.65625em;border:.125em solid #ff0000;pointer-events:none;z-index:1}

#plan .kp-side.right input{transform:rotate(180deg)}

.kp-keep{position:absolute;inset:9.6em;display:flex;align-items:center;justify-content:center;pointer-events:none}

.kp-notes h4{margin:0;background:#333d4c;color:#fff;text-align:center;font-size:.8em;line-height:1.95;letter-spacing:.05em}
#plan .kp-notes input{all:unset;box-sizing:border-box;display:block;width:100%;height:1.88em;font:inherit;font-size:.83em;color:#191919;padding:0 .5em;cursor:text}

/* ---------- time helpers ---------- */
function parseTime(str){
  if(str==null) return null;
  const s = String(str).trim().toLowerCase().replace(/\s+/g,"");
  if(!s) return null;
  let m;
  if((m = s.match(/^(\d{1,3}):(\d{1,2})$/))) return +m[1]*60 + +m[2];
  if((m = s.match(/^(?:(\d{1,3})(?:m|min|mn|분|dk))?(?:(\d{1,4})(?:s|sec|sn|초)?)?$/)) && (m[1]||m[2])) return (+m[1]||0)*60 + (+m[2]||0);
  return null;
}
function fmt(sec){ sec = Math.max(0, Math.round(sec)); const m = Math.floor(sec/60), s = sec%60; return m ? `${m}m${String(s).padStart(2,"0")}` : `${s}s`; }
function fmtClock(sec){ const neg = sec<0; sec = Math.abs(Math.ceil(sec)); const h = Math.floor(sec/3600), m = Math.floor(sec/60)%60, s = sec%60, p2 = n=>String(n).padStart(2,"0");
  return (neg?"-":"") + (h ? `${h}:${p2(m)}:${p2(s)}` : m ? `${m}:${p2(s)}` : `${s}`); }
/* UTC wall clock "21:30:52" */
function fmtUTC(ms){ return new Date(ms).toISOString().slice(11,19); }
/* "21:30", "21:30:15", "2130", "21h30" -> next occurrence of that UTC time (ms) */
function parseUTC(str){
  const m = String(str||"").trim().toLowerCase().match(/^(\d{1,2})\s*[:h. ]?\s*(\d{2})(?:\s*[:m.]?\s*(\d{2}))?\s*(?:s|utc)?$/);
  if(!m || +m[1] > 23 || +m[2] > 59 || (m[3] && +m[3] > 59)) return null;
  const now = new Date(serverNow());
  let tms = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), +m[1], +m[2], +(m[3]||0));
  if(tms < now.getTime() - 5000) tms += 86400000;   // already passed today -> tomorrow
  return tms;
}

/* parse "Yordan 30s, Jimmy 1m46; Bloom 54s" (also newlines) */
function parseRoster(text){
  const out = [], bad = [];
  text.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean).forEach(chunk=>{
    // split name / time: time = last token(s) that parse; allow "Jimmy 1m 46s" and "Jimmy marching time 1m46"
    const toks = chunk.split(/\s+/);
    for(let k=Math.min(2,toks.length-1); k>=1; k--){
      const time = parseTime(toks.slice(-k).join(""));
      if(time!=null){
        const name = toks.slice(0,-k).join(" ").replace(/\b(marching|march|time|temps|de|marche)\b/gi,"").replace(/[:\-–]+$/,"").trim();
        if(name){ out.push({name, march:time}); return; }
      }
    }
    if(toks.length===1 || parseTime(toks[toks.length-1])==null){ out.push({name:chunk, march:0}); return; }
    bad.push(chunk);
  });
  return {out,bad};
}

/* ---------- model helpers ---------- */
function findPlayer(pid){
  for(const tm of S.teams){ const i = tm.players.findIndex(p=>p.id===pid); if(i>=0) return {list:tm.players,i,team:tm}; }
  const i = S.bench.findIndex(p=>p.id===pid); if(i>=0) return {list:S.bench,i,team:null};
  return null;
}
function listOf(dest){ return dest==="bench" ? S.bench : (S.teams.find(x=>x.id===dest)||{}).players; }
function movePlayer(pid, dest){
  const f = findPlayer(pid), to = listOf(dest);
  if(!f || !to || f.list===to) return;
  mutate(()=>{ const [p] = f.list.splice(f.i,1); to.push(p); });
}
/* launch schedule for a team: offset (s) after first launch */
function schedule(tm){
  const max = tm.players.reduce((a,p)=>Math.max(a,p.march||0),0);
  const rows = tm.players.map(p=>({p, off:max-(p.march||0)})).sort((a,b)=>a.off-b.off || a.p.name.localeCompare(b.p.name));
  return {max, rows, total: max + tm.rally};
}

/* ---------- free layout (desktop/tablet) ---------- */
const CW = 340, SMIN = .4, SMAX = 3, GAP = 12, prevH = {};
const freeMQ = matchMedia("(min-width:700px)");
function isFree(){ return freeMQ.matches; }
function colCount(){ return Math.max(1, Math.floor((board.clientWidth + GAP) / (CW + GAP))); }
function cards(){ return [...board.querySelectorAll("[data-card]")]; }
const sOf = p => (p && p.s) || 1;
const wOf = p => Math.round(CW * sOf(p));
/* resizing scales the whole block like a zoom (same proportions): the grey box always hugs its content */
function applySize(c, p){
  const inner = c.querySelector(".inner"), sc = sOf(p);
  c.style.width = wOf(p) + "px";
  if(sc === 1){ inner.style.transform = inner.style.width = ""; c.style.height = ""; return; }
  inner.style.width = (CW - 2) + "px";
  inner.style.transform = `scale(${sc})`;
  c.style.height = Math.ceil(inner.offsetHeight * sc + 5) + "px";   // + top/bottom borders
}
function layout(){
  const free = isFree();
  board.classList.toggle("free", free);
  document.getElementById("alignBtn").hidden = !free;
  if(!free){ cards().forEach(c=>{ c.style.left = c.style.top = c.style.zIndex = c.style.width = c.style.height = ""; const i = c.querySelector(".inner"); i.style.transform = i.style.width = ""; }); board.style.height = ""; return; }
  const ids = new Set(cards().map(c=>c.dataset.card));
  for(const k in S.pos) if(!ids.has(k)) delete S.pos[k];
  cards().forEach(c=>applySize(c, S.pos[c.dataset.card]));
  // place cards that have no position yet in the shortest column
  const nCols = colCount(), bottoms = Array(nCols).fill(0);
  cards().filter(c=>S.pos[c.dataset.card]).forEach(c=>{
    const p = S.pos[c.dataset.card], h = c.offsetHeight, w = wOf(p);
    for(let k=0;k<nCols;k++){ const cx = k*(CW+GAP); if(p.x < cx+CW && p.x+w > cx) bottoms[k] = Math.max(bottoms[k], p.y + h + GAP); }
  });
  let changed = false;
  cards().forEach(c=>{
    const id = c.dataset.card;
    if(!S.pos[id]){
      let k = 0; for(let j=1;j<nCols;j++) if(bottoms[j] < bottoms[k]) k = j;
      S.pos[id] = {x:k*(CW+GAP), y:bottoms[k], z:++S.ztop};
      applySize(c, S.pos[id]);
      bottoms[k] += c.offsetHeight + GAP; changed = true;
    }
  });
  // a block that grew (players added / resized taller) pushes down the blocks just below it instead of covering them
  const items = cards().map(c=>({id:c.dataset.card, c, h:c.offsetHeight, p:S.pos[c.dataset.card]}));
  const overlapX = (a,b)=> a.p.x < b.p.x + wOf(b.p) && b.p.x < a.p.x + wOf(a.p);
  const push = (a, oldBottom, depth)=>{
    if(depth > 40) return;
    const need = a.p.y + a.h + GAP;
    items.forEach(b=>{
      if(b===a || !overlapX(a,b)) return;
      if(b.p.y >= oldBottom - 2 && b.p.y < need){ const ob = b.p.y + b.h + GAP; b.p.y = need; changed = true; push(b, ob, depth+1); }
    });
  };
  if(!(cdrag && cdrag.on) && !rdrag) items.slice().sort((a,b)=>a.p.y-b.p.y).forEach(a=>{
    const old = prevH[a.id];
    if(old != null && a.h > old) push(a, a.p.y + old + GAP, 0);
  });
  items.forEach(a=>{ prevH[a.id] = a.h; });
  if(changed) save();
  let maxB = 0;
  cards().forEach(c=>{
    const p = S.pos[c.dataset.card];
    c.style.left = Math.max(0, Math.min(p.x, board.clientWidth - wOf(p))) + "px"; c.style.top = p.y + "px"; c.style.zIndex = p.z || 1;
    maxB = Math.max(maxB, p.y + c.offsetHeight);
  });
  board.style.height = (maxB + 160) + "px";
}
/* Align: each block snaps to its nearest column, then stacks cleanly by vertical order.
   Columns take the width of their widest block, so resized blocks line up too. */
function align(){
  if(!isFree()) return;
  snap();
  const nCols = Math.max(colCount(), 1), cols = Array.from({length:nCols}, ()=>[]);
  cards().forEach(c=>{
    const p = S.pos[c.dataset.card] || {x:0,y:0};
    const k = Math.max(0, Math.min(nCols-1, Math.round(p.x / (CW+GAP))));
    cols[k].push({c, p});
  });
  let x = 0;
  cols.forEach(list=>{
    if(!list.length) return;
    list.sort((a,b)=>a.p.y-b.p.y || a.p.x-b.p.x);
    let y = 0, colW = 0;
    list.forEach(({c})=>{ const id = c.dataset.card; S.pos[id] = Object.assign({}, S.pos[id], {x, y}); y += c.offsetHeight + GAP; colW = Math.max(colW, wOf(S.pos[id])); });
    x += colW + GAP;
  });
  board.classList.add("anim"); layout(); save(); undoBtn.disabled = false;
  setTimeout(()=>board.classList.remove("anim"), 300);
}
/* resize a block from its bottom-right corner (double-click the corner = default size) */
let rdrag = null;
board.addEventListener("pointerdown", e=>{
  const r = e.target.closest(".resizer"); if(!r || !isFree() || e.button > 0) return;
  e.preventDefault(); e.stopPropagation();
  const card = r.closest("[data-card]");
  rdrag = {card, id:card.dataset.card, x0:e.clientX, y0:e.clientY, s0:sOf(S.pos[card.dataset.card]), nat:card.querySelector('.inner').offsetHeight + 5, on:false, pid:e.pointerId};
});
addEventListener("pointermove", e=>{
  if(!rdrag || e.pointerId!==rdrag.pid) return;
  const dx = e.clientX-rdrag.x0, dy = e.clientY-rdrag.y0;
  if(!rdrag.on){
    if(Math.hypot(dx,dy) < 3) return;
    rdrag.on = true; snap(); undoBtn.disabled = false; closeMenu();
    const p = S.pos[rdrag.id]; p.z = ++S.ztop; rdrag.card.style.zIndex = S.ztop; rdrag.card.classList.add("lifted");
    document.body.style.userSelect = "none";
  }
  e.preventDefault();
  const p = S.pos[rdrag.id];
  // follow whichever direction the mouse moved the most (proportional zoom)
  const sw = (CW*rdrag.s0 + dx) / CW, sh = (rdrag.nat*rdrag.s0 + dy) / rdrag.nat;
  let sc = Math.abs(sw - rdrag.s0) >= Math.abs(sh - rdrag.s0) ? sw : sh;
  sc = Math.max(SMIN, Math.min(SMAX, (board.clientWidth - p.x) / CW, sc));
  p.s = Math.round(sc * 100) / 100; if(p.s === 1) delete p.s;
  applySize(rdrag.card, p);
  const need = p.y + rdrag.card.offsetHeight + 160; if(need > board.offsetHeight) board.style.height = need + "px";
}, {passive:false});
function endResize(e){
  if(!rdrag || (e && e.pointerId!==rdrag.pid)) return;
  const d = rdrag; rdrag = null;
  if(!d.on) return;
  d.card.classList.remove("lifted"); document.body.style.userSelect = "";
  save(); layout();
}
addEventListener("pointerup", endResize);
addEventListener("pointercancel", endResize);
board.addEventListener("dblclick", e=>{
  const r = e.target.closest(".resizer"); if(!r) return;
  const p = S.pos[r.closest("[data-card]").dataset.card]; if(!p) return;
  snap(); delete p.s; save(); layout(); undoBtn.disabled = false;
});
/* drag a block by its header */
let cdrag = null;
board.addEventListener("pointerdown", e=>{
  if(!isFree() || e.button > 0) return;
  const head = e.target.closest(".thead");
  if(!head || e.target.closest("button,input,label")) return;
  const card = head.closest("[data-card]"), p = S.pos[card.dataset.card];
  cdrag = {card, id:card.dataset.card, x0:e.clientX, y0:e.clientY, px:p.x, py:p.y, sy:scrollY, on:false, pid:e.pointerId};
});
addEventListener("pointermove", e=>{
  if(!cdrag || e.pointerId!==cdrag.pid) return;
  const dx = e.clientX-cdrag.x0, dy = e.clientY-cdrag.y0;
  if(!cdrag.on){
    if(Math.hypot(dx,dy) < 5) return;
    cdrag.on = true; closeMenu(); snap(); undoBtn.disabled = false;
    S.pos[cdrag.id].z = ++S.ztop; cdrag.card.style.zIndex = S.ztop; cdrag.card.classList.add("lifted");
    document.body.style.userSelect = "none";
  }
  e.preventDefault();
  cdrag.cx = e.clientX; cdrag.cy = e.clientY;
  moveCard();
  cdrag.scroll = e.clientY > innerHeight-50 ? 14 : e.clientY < 110 && scrollY > 0 ? -14 : 0;
  if(cdrag.scroll && !cdrag.raf){ const step = ()=>{ if(!cdrag || !cdrag.scroll){ if(cdrag) cdrag.raf = 0; return; } scrollBy(0, cdrag.scroll); moveCard(); cdrag.raf = requestAnimationFrame(step); }; cdrag.raf = requestAnimationFrame(step); }
}, {passive:false});
function moveCard(){
  const d = cdrag, p = S.pos[d.id];
  p.x = Math.round(Math.max(0, Math.min(board.clientWidth - wOf(p), d.px + d.cx - d.x0)));
  p.y = Math.round(Math.max(0, d.py + d.cy - d.y0 + scrollY - d.sy));
  d.card.style.left = p.x + "px"; d.card.style.top = p.y + "px";
  const need = p.y + d.card.offsetHeight + 160; if(need > board.offsetHeight) board.style.height = need + "px";
}
function endCardDrag(e){
  if(!cdrag || (e && e.pointerId!==cdrag.pid)) return;
  const d = cdrag; cdrag = null;
  if(d.raf) cancelAnimationFrame(d.raf);
  if(!d.on) return;
  d.card.classList.remove("lifted"); document.body.style.userSelect = "";
  save(); layout();
}
addEventListener("pointerup", endCardDrag);
addEventListener("pointercancel", endCardDrag);
freeMQ.addEventListener ? freeMQ.addEventListener("change", ()=>layout()) : freeMQ.addListener(()=>layout());
addEventListener("resize", ()=>layout());

/* ---------- live countdown ---------- */
const beeped = new Set();
function tick(force){
  if(pendingRemote && !isBusy()){ const d = pendingRemote; pendingRemote = null; applyRemote(d); }
  const now = serverNow();
  const utc = fmtUTC(now); document.getElementById("clock").textContent = "UTC " + utc;
  board.querySelectorAll("[data-utc]").forEach(el=>{ if(el.textContent!==utc) el.textContent = utc; });
  let anyRun = false;
  S.teams.forEach(tm=>{
    const card = board.querySelector(`[data-tid="${tm.id}"]`); if(!card) return;
    const st = card.querySelector(".status");
    const sc = schedule(tm);
    if(!tm.start){
      if(force){ const ch = jump.querySelector(`[data-chip="${tm.id}"]`); if(ch){ ch.textContent = ""; ch.parentNode.classList.remove("hot","soon"); } }
      if(force){ st.className="status"; st.innerHTML = `<span>${esc(t("rally"))} ${fmt(tm.rally)} + ${esc(t("march"))} ${fmt(sc.max)}</span><b>= ${fmt(sc.total)}</b>`; }
      return;
    }
    anyRun = true;
    const land = tm.start + sc.total*1000, toLand = (land-now)/1000, toFirst = (tm.start-now)/1000;
    if(toLand < -20){ tm.start = null; save(); render(); return; }
    if(toLand <= 0){ st.className="status landed"; st.innerHTML = `<span>🏰</span><b>${esc(t("landed"))}</b>`; }
    else if(toFirst > 0){ st.className="status"; st.innerHTML = `<span>${esc(t("firstIn"))}</span><b>${fmtClock(toFirst)}</b>`; }
    else { st.className="status"; st.innerHTML = `<span>${esc(t("landsIn"))}</span><b>${fmtClock(toLand)}</b>`; }
    let nextLi = null, nextRem = Infinity;
    card.querySelectorAll(".cd").forEach(el=>{
      const off = +el.dataset.off, rem = (tm.start + off*1000 - now)/1000;
      const pid = el.closest("li").dataset.pid;
      let cls, txt;
      if(rem > 10){ cls="cd"; txt=fmtClock(rem); }
      else if(rem > 5){ cls="cd soon"; txt=fmtClock(rem); }
      else if(rem > 0){ cls="cd hot"; txt=fmtClock(rem); }
      else if(rem > -3){ cls="cd now"; txt=t("launch"); }
      else { cls="cd done"; txt="✓"; }
      const li = el.closest("li");
      if(rem > -0.5 && rem < nextRem){ nextRem = rem; nextLi = li; }
      li.classList.toggle("gone", rem <= -3);
      if(el.className!==cls) el.className = cls;
      if(el.textContent!==txt) el.textContent = txt;
      // beeps: 3,2,1 then launch
      const sec = Math.ceil(rem);
      if(rem > -0.5 && sec <= 5 && sec >= 0){
        const k = `${tm.id}:${tm.start}:${pid}:${sec}`;
        if(!beeped.has(k)){ beeped.add(k); beep(sec===0 ? 1046 : 660, sec===0 ? .35 : .09); if(S.sound && navigator.vibrate) try{ navigator.vibrate(sec===0 ? [250,80,250] : 60); }catch(e){} }
      }
    });
    card.querySelectorAll("li.player").forEach(li=>li.classList.toggle("next", li===nextLi));
    const chip = jump.querySelector(`[data-chip="${tm.id}"]`);
    if(chip){
      const txt = nextRem < Infinity ? (nextRem > 0 ? fmtClock(nextRem) : "GO!") : toLand > 0 ? "🏰 " + fmtClock(toLand) : "✓";
      if(chip.textContent !== txt) chip.textContent = txt;
      const cl = chip.parentNode.classList; cl.toggle("hot", nextRem <= 5 && nextRem < Infinity); cl.toggle("soon", nextRem > 5 && nextRem <= 10);
    }
  });
  if(beeped.size > 2000) beeped.clear();
  wake(anyRun);
}
setInterval(tick, 100);

/* ---------- audio & wake lock ---------- */
let actx = null;
/* kind: "fx" = casino door animations, anything else = countdown beeps */
function beep(freq, dur, kind){
  if(!S.sound) return;
  const vol = kind === "fx" ? (S.volFx ?? .4) : (S.volBeep ?? 1);
  if(vol <= 0) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.frequency.value = freq; o.type = "square";
    g.gain.setValueAtTime(.15 * vol, actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime+dur);
    o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime+dur+.02);
  }catch(e){}
}
let lock = null, wantLock = false;
async function wake(on){
  if(on===wantLock && (!on || lock)) return;
  wantLock = on;
  try{
    if(on && !lock && navigator.wakeLock && document.visibilityState==="visible"){ lock = await navigator.wakeLock.request("screen"); lock.addEventListener("release",()=>{lock=null;}); }
    if(!on && lock){ await lock.release(); lock=null; }
  }catch(e){}
}

/* ---------- actions ---------- */
function goTeam(tm, extraDelay){ tm.start = serverNow() + (S.lead + (extraDelay||0))*1000; }
function goAll(baseMs){
  const teams = S.teams.filter(x=>x.players.length); if(!teams.length) return;
  const maxTotal = Math.max(...teams.map(x=>schedule(x).total));
  const base = typeof baseMs === "number" ? baseMs : serverNow() + S.lead*1000;
  // every team lands at the same instant; the slowest team launches first, at "base"
  teams.forEach(x=>{ x.start = base + (maxTotal - schedule(x).total)*1000; });
  actx && actx.resume && actx.resume(); beep(880,.05);
  save(); render();
}
function stopAll(){ S.teams.forEach(x=>x.start=null); save(); render(); }

function addPlayers(dest, input){
  const {out,bad} = parseRoster(input.value);
  if(!out.length){ if(bad.length) toast(t("badTime")); return; }
  mutate(()=>{ const list = listOf(dest); out.forEach(o=>list.push({id:uid("p"), name:o.name, march:o.march})); });
  const el = board.querySelector(`[data-add="${dest}"]`); if(el){ el.value = bad.join(", "); el.focus(); }
  if(bad.length) toast(t("badTime"));
}
function copyTeam(tm, i){
  const sc = schedule(tm);
  const lines = [`⚔️ ${tm.alliance?`[${tm.alliance}] `:""}${teamName(tm,i)} — ${t("rally")} ${fmt(tm.rally)}`];
  if(tm.start){
    lines[0] += ` — ${t("landAt")} ${fmtUTC(tm.start + sc.total*1000)} UTC`;
    sc.rows.forEach((r,k)=>lines.push(`${k+1}. ${r.p.name} — ${fmtUTC(tm.start + r.off*1000)} UTC`));
  } else sc.rows.forEach((r,k)=>lines.push(`${k+1}. ${r.p.name} — ${r.off===0?"GO":"+"+fmt(r.off)}`));
  const txt = lines.join("\n");
  (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(()=>toast(t("copied")), ()=>{ ask("📋", txt, "text"); });
}

board.addEventListener("click", e=>{
  const b = e.target.closest("[data-act]"); if(!b) return;
  const act = b.dataset.act, card = b.closest("[data-drop]"), tid = card && card.dataset.drop;
  const tm = S.teams.find(x=>x.id===tid), ti = S.teams.indexOf(tm);
  const li = b.closest("li.player"), pid = li && li.dataset.pid;
  switch(act){
    case "add": addPlayers(b.dataset.team, board.querySelector(`[data-add="${b.dataset.team}"]`)); break;
    case "rally": mutate(()=>{ tm.rally = +b.dataset.v; }); break;
    case "rallyc": ask(t("rallyCustom"), fmt(tm.rally)).then(r=>{ const v = parseTime(r); if(v) mutate(()=>{ tm.rally=v; }); else if(r!=null) toast(t("badTime")); }); break;
    case "plan": ask(t("planPrompt"), tm.start ? fmtUTC(tm.start).slice(0,5) : fmtUTC(serverNow()+120000).slice(0,5)).then(v=>{
      if(v==null) return; const ms = parseUTC(v); if(ms==null){ toast(t("badClock")); return; }
      tm.start = ms; actx && actx.resume && actx.resume(); save(); render(); }); break;
    case "go": goTeam(tm); actx && actx.resume && actx.resume(); beep(880,.05); save(); render(); break;
    case "stop": tm.start = null; save(); render(); break;
    case "copy": copyTeam(tm, ti); break;
    case "delteam": mutate(()=>{ S.bench.push(...tm.players); S.teams.splice(ti,1); }); toast(t("deleted"), true); break;
    case "delp": mutate(()=>{ const f = findPlayer(pid); f && f.list.splice(f.i,1); }); break;
    case "move": openMoveMenu(pid, b); break;
    case "rename": if(!isFree()) renameTeam(tm, b.textContent); break;
  }
});
board.addEventListener("dblclick", e=>{
  const tn = e.target.closest(".tname[data-act=rename]");

var SESSION = null, STORE = null, pendingRemote = null, synced = {}, metaCache = {}, presenceCache = {}, unsubData = null, leavePresence = null;

const vals = o => Array.isArray(o) ? o : Object.values(o || {});

/* what is shared, split into small paths so two people editing different teams never overwrite each other */
function rosterParts(){
  const p = { bench: S.bench, order: S.teams.map(x=>x.id),
    allyColors: Object.fromEntries(Object.entries(S.allyColors || {}).map(([k,v])=>[encK(k), v])) };
  S.teams.forEach(x=>{ p["teams/" + x.id] = x; });
  return p;
}
function markSynced(){ synced = {}; const p = rosterParts(); for(const k in p) synced[k] = JSON.stringify(p[k]); }
function syncRoster(){
  if(!SESSION || !STORE) return;
  const p = rosterParts(), upd = {};
  for(const k in p){ const j = JSON.stringify(p[k]); if(synced[k] !== j){ upd[k] = clean(p[k]); synced[k] = j; } }
  for(const k in synced) if(!(k in p)){ upd[k] = null; delete synced[k]; }
  if(Object.keys(upd).length) STORE.write(SESSION.id, upd);
}
const normPlayer = p => ({ id:String(p.id), name:String(p.name || ""), march:+p.march || 0 });
function normTeam(x, id){
  const tm = { id, name:String(x.name || ""), rally:+x.rally || 300, start:x.start || null, players: vals(x.players).filter(Boolean).map(normPlayer) };
  if(x.alliance) tm.alliance = String(x.alliance);

}
function isBusy(){

  return !!((drag && drag.on) || (cdrag && cdrag.on) || rdrag || menuEl ||
    (ae && board.contains(ae) && ae.tagName === "INPUT" && !ae.dataset.add));

function applyRemote(d){
  const order = vals(d.order).filter(Boolean), map = d.teams || {};
  const ids = order.filter(id=>map[id]).concat(Object.keys(map).filter(id=>!order.includes(id)));
  const next = { bench: vals(d.bench).filter(Boolean).map(normPlayer), teams: ids.map(id=>normTeam(map[id], id)),
    allyColors: Object.fromEntries(Object.entries(d.allyColors || {}).map(([k,v])=>[decK(k), v])) };
  if(isBusy()){ pendingRemote = d; return; }
  const same = JSON.stringify(next) === JSON.stringify({bench:S.bench, teams:S.teams.map(x=>normTeam(x, x.id)), allyColors:S.allyColors});
  S.bench = next.bench; S.teams = next.teams; S.allyColors = next.allyColors;
  markSynced();
  if(!same) render();
}

/* ---------- store on this device (no setup needed; also the fallback) ---------- */
function LocalStore(){
  const K = "rallysync.store", subs = new Set();
  const read = ()=>{ const d = loadJSON(K) || {}; d.meta = d.meta || {}; d.sessions = d.sessions || {}; return d; };
  const emit = ()=>subs.forEach(f=>{ try{ f(); }catch(e){ console.error(e); } });
  const put = d=>{ saveJSON(K, d); setTimeout(emit, 0); };
  addEventListener("storage", e=>{ if(e.key === K) emit(); });
  const setPath = (obj, path, v)=>{ const ks = path.split("/"); let o = obj;
    ks.slice(0,-1).forEach(k=>{ o = o[k] = (o[k] && typeof o[k] === "object") ? o[k] : {}; });
    const last = ks[ks.length-1]; if(v === null) delete o[last]; else o[last] = v; };
  return {
    mode:"local",
    listSessions(cb){ const f = ()=>cb(read().meta); subs.add(f); f(); return ()=>subs.delete(f); },
    presence(cb){ cb({}); return ()=>{}; },
    async create(name, data){ const d = read(), id = uid("s"), ts = Date.now(); d.meta[id] = {name, created:ts, updated:ts}; d.sessions[id] = clean(data); put(d); return id; },
    rename(id, name){ const d = read(); if(d.meta[id]){ d.meta[id].name = name; d.meta[id].updated = Date.now(); put(d); } },
    remove(id){ const d = read(); delete d.meta[id]; delete d.sessions[id]; put(d); },
    open(id, cb){ let last; const f = ()=>{ const v = read().sessions[id] ?? null, j = JSON.stringify(v); if(j !== last){ last = j; cb(v); } }; subs.add(f); f(); return ()=>subs.delete(f); },
    write(id, upd){ const d = read(); if(!d.sessions[id]) return; for(const k in upd) setPath(d.sessions[id], k, clean(upd[k])); if(d.meta[id]) d.meta[id].updated = Date.now(); put(d); },
    join(){ return ()=>{}; }
  };
}

/* ---------- shared online store: Firebase Realtime Database (free Spark plan) ---------- */
async function FirebaseStore(cfg){
  const base = "https://www.gstatic.com/firebasejs/13.2.0/";
  const [A, D] = await Promise.all([import(base + "firebase-app.js"), import(base + "firebase-database.js")]);
  const db = D.getDatabase(A.initializeApp(cfg));
  const R = p => D.ref(db, ROOT + (p ? "/" + p : ""));
  const TS = () => D.serverTimestamp();
  const fail = e => { console.error(e); toast("⚠️ " + (e && e.code || e)); };
  D.onValue(D.ref(db, ".info/serverTimeOffset"), sn=>{ clock.offset = +sn.val() || 0; });
  const st = { mode:"online", connected:true };
  D.onValue(D.ref(db, ".info/connected"), sn=>{ const c = !!sn.val(); if(st.connected && !c && SESSION) toast(t("offline")); st.connected = c; updateSessUI(); });
  // the database must answer within 9 s (connection check: nothing private is read here)
  await new Promise((res, rej)=>{ const timer = setTimeout(()=>rej(new Error("timeout")), 9000);
    const off = D.onValue(D.ref(db, ".info/connected"), sn=>{ if(sn.val()){ clearTimeout(timer); setTimeout(()=>off(), 0); res(); } }, e=>{ clearTimeout(timer); rej(e); }); });
  st.listSessions = cb => D.onValue(R("meta"), sn=>cb(sn.val() || {}), fail);
  st.presence = cb => D.onValue(R("presence"), sn=>cb(sn.val() || {}), ()=>{});
  st.create = async (name, data)=>{ const id = D.push(R("meta")).key;
    await D.update(R(), {[`meta/${id}`]:{name, created:TS(), updated:TS()}, [`sessions/${id}`]:clean(data)}); return id; };
  st.rename = (id, name)=>D.update(R(), {[`meta/${id}/name`]:name, [`meta/${id}/updated`]:TS()}).catch(fail);
  st.remove = id=>D.update(R(), {[`meta/${id}`]:null, [`sessions/${id}`]:null, [`presence/${id}`]:null}).catch(fail);
  st.open = (id, cb)=>D.onValue(R(`sessions/${id}`), sn=>cb(sn.val()), fail);
  st.write = (id, upd)=>{ const u = {}; for(const k in upd) u[`sessions/${id}/${k}`] = upd[k]; u[`meta/${id}/updated`] = TS(); return D.update(R(), u).catch(fail); };
  st.join = id=>{ const me = D.push(R(`presence/${id}`)); D.onDisconnect(me).remove(); D.set(me, TS()); return ()=>{ D.remove(me); }; };
  st.raw = { TS, on:(path, cb, err)=>D.onValue(D.ref(db, path), sn=>cb(sn.val()), err), update:map=>D.update(D.ref(db), map) };
  return st;
}

async function derive752(app, code){

    busy = true; spinBtn.disabled = true; pass.disabled = true; msg.textContent = "";
    try{ actx = actx || new (window.AudioContext||window.webkitAudioContext)(); actx.resume && actx.resume(); }catch(e){}
    lever.classList.add("pulled"); setTimeout(()=>lever.classList.remove("pulled"), 450);
    const ok = cyrb53("rallysync:" + code, 7) === HASH;
    // where the reels stop: S-H-0 on a win, NOOB-NOOB-NOOB on a loss
    const target = ok ? WIN.slice() : [NOOB, NOOB, NOOB];
    const h = ch(), ticking = setInterval(()=>tickSound(300 + Math.random()*400, .02), 90);
    strips.forEach((s,i)=>{
      s.style.transition = "none"; s.style.transform = `translateY(${-pos[i]*h}px)`; s.classList.add("blur");
      void s.offsetHeight;
      const dur = 900 + i*450, end = L*(REP-2) + target[i];
      s.style.transition = `transform ${dur}ms cubic-bezier(.12,.6,.2,1)`;
      s.style.transform = `translateY(${-end*h}px)`;
      setTimeout(()=>{ s.classList.remove("blur"); pos[i] = target[i]; show(i); tickSound(880,.06);
        if(i === N-1){ clearInterval(ticking); setTimeout(()=>result(ok), 150); } }, dur + 20);
    });
  }
  function result(ok){
    if(ok){
      msg.textContent = "🎉 " + t("gWin") + " 🎉"; msg.className = "g-msg win"; gate.classList.add("win","flash");
      [523,659,784,1046].forEach((f,k)=>setTimeout(()=>tickSound(f,.18), k*120));
      coins();
      try{ sessionStorage.setItem(GATE_KEY, JSON.stringify({h:HASH, until:Date.now()+REMEMBER_MS})); }catch(e){}   // only while this tab stays open
      setTimeout(()=>gate.classList.add("out"), 1300);
      setTimeout(()=>{ document.documentElement.classList.remove("locked"); afterUnlock(); gate.classList.remove("out","win","flash");
        busy = false; spinBtn.disabled = false; pass.disabled = false; pass.value = ""; layout(); }, 1900);
    } else {
      msg.textContent = t("gLose"); msg.className = "g-msg lose";
      cab.classList.remove("shake"); void cab.offsetWidth; cab.classList.add("shake"); tickSound(160,.25);
      busy = false; spinBtn.disabled = false; pass.disabled = false; pass.select(); pass.focus();
    }
  }
  function coins(){
    const icons = ["🪙","💰","💎","🪙","🍀","7️⃣"];
    for(let k=0;k<46;k++){ const c = document.createElement("span"); c.className = "g-coin"; c.textContent = icons[k%icons.length];
      c.style.left = Math.random()*100 + "vw"; c.style.animationDuration = (1.2 + Math.random()*1.4) + "s"; c.style.animationDelay = (Math.random()*.6) + "s";
      document.body.appendChild(c); setTimeout(()=>c.remove(), 3200); }
  }
  spinBtn.addEventListener("click", spin);
  /* lever: tap or drag it down */
  let ly = null;
  lever.addEventListener("pointerdown", e=>{ ly = e.clientY; lever.setPointerCapture && lever.setPointerCapture(e.pointerId); e.preventDefault(); });
  lever.addEventListener("pointermove", e=>{ if(ly!=null && e.clientY - ly > 40){ ly = null; spin(); } });
  lever.addEventListener("pointerup", ()=>{ if(ly!=null){ ly = null; spin(); } });
  function lockNow(){
    try{ sessionStorage.removeItem(GATE_KEY); localStorage.removeItem("rallysync.admin"); }catch(e){}
    document.getElementById("settings").open && document.getElementById("settings").close();
    pass.value = ""; msg.textContent = ""; msg.className = "g-msg"; document.documentElement.classList.add("locked"); focusPass();
  }
  document.getElementById("lockBtn").addEventListener("click", lockNow);
  document.getElementById("lockTop").addEventListener("click", lockNow);
  // focus the field on computers (on phones, wait for a tap so the keyboard does not pop up by itself)
  function focusPass(){ if(matchMedia("(pointer:fine)").matches) setTimeout(()=>pass.focus(), 50); }
  // casino sounds start muted on every visit (countdown beeps are not affected); 🔇 brings them back
  if((S.volFx ?? .4) > 0) S._fxPrev = S.volFx ?? .4;
  S.volFx = 0;
  const gVol = document.getElementById("gVol"), gMute = document.getElementById("gMute");
  function volUI(){ const v = S.sound ? Math.round((S.volFx ?? .4)*100) : 0; gVol.value = v; gMute.textContent = v === 0 ? "🔇" : v < 50 ? "🔉" : "🔊"; }
  gVol.addEventListener("input", ()=>{ S.volFx = gVol.value/100; if(+gVol.value > 0) S.sound = true; save(); volUI(); });
  gVol.addEventListener("change", ()=>tickSound(784,.12));
  gMute.addEventListener("click", ()=>{ if((S.volFx ?? .4) > 0 && S.sound){ S._fxPrev = S.volFx ?? .4; S.volFx = 0; } else { S.volFx = S._fxPrev || .4; S.sound = true; } save(); volUI(); tickSound(784,.08); });
  volUI();
  texts(); requestAnimationFrame(()=>strips.forEach((_,i)=>show(i)));
  addEventListener("resize", ()=>strips.forEach((_,i)=>show(i)));
  if(isLocked()) focusPass(); else afterUnlock();
  const _render = render; render = function(){ _render.apply(this, arguments); texts(); };
})();
