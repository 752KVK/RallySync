#bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;background:#140a24d9;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}

.gwrap{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}

.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;min-height:320px;padding:14px;border-radius:var(--r);background:#0003;border:1px solid var(--line);user-select:none;-webkit-user-select:none}
.stage canvas{display:block;max-width:100%;border-radius:12px;touch-action:none;background:#0b0616}
.hud{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-weight:800}
.hud span{padding:6px 12px;border-radius:999px;background:#0005;border:1px solid var(--line)}
.ovl{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:18px;text-align:center;border-radius:var(--r);background:#12082299;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
.ovl h3{margin:0;font-size:28px;font-weight:900}
.ovl .big{font-size:42px;font-weight:900;color:var(--gold);text-shadow:0 0 18px #ffd16677}
.pad{direction:ltr;display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,52px);gap:8px;justify-content:center}
.pad .btn{min-height:0;font-size:22px;padding:0}
.board{padding:14px}
.board h3{margin:0 0 4px;font-size:18px;display:flex;align-items:center;gap:8px}
.lb{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:5px}
.lb li{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:12px;background:#0003;border:1px solid transparent;font-weight:700;font-size:14px;transition:background .3s}
.lb li.me{background:#ff4fa333;border-color:var(--pink)}
.lb li.gap{justify-content:center;background:none;padding:0;color:var(--mut)}
.lb li.flash{animation:flash 1s}
@keyframes flash{0%{background:#ffd16688}100%{}}
.lb .n{width:30px;flex:none;text-align:center;font-weight:900}
.lb .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb .v{font-variant-numeric:tabular-nums;font-weight:900;color:var(--gold);white-space:nowrap}
.lb .av{width:28px;height:28px}
.lb .empty{justify-content:center;color:var(--mut);font-weight:600}
.rtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.rtabs::-webkit-scrollbar{display:none}
.rtabs button{flex:none;min-height:38px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:800;font-size:14px}
.rtabs button.on{background:var(--gold);color:#2a1a00;border-color:var(--gold)}
/* modal + toast */
#modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 12px 16px;background:#0009;overflow-y:auto}
#modal.on{display:flex}
#modal .card{width:100%;max-width:480px;margin-top:4vh;animation:pop .2s}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));z-index:60;transform:translateX(-50%) translateY(-20px);opacity:0;padding:10px 18px;border-radius:999px;background:#000c;border:1px solid var(--gold);font-weight:800;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70}
.loading{padding:40px;text-align:center;color:var(--mut);font-weight:700}
.recs{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px;margin-top:8px}
.recs b{color:var(--gold);text-align:end;font-variant-numeric:tabular-nums}
[dir=rtl] .flipx{transform:scaleX(-1)}
@media (max-width:520px){#bar{gap:6px;padding-left:10px;padding-right:10px}#toHub span{display:none}#bar .btn.sm{padding:5px 8px}.chip{max-width:34vw;min-width:0}#bar h1{font-size:17px;letter-spacing:1px}.chip .tag{display:none}.btn{font-size:14px}.games{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.gcard{min-height:120px;padding:12px}.gcard .ic{font-size:32px}.stage{padding:10px}}
</style>
<style id="gameCss">
/* ---- blackjack ---- */
.bj-table{width:100%;max-width:620px;padding:14px;border-radius:22px;background:var(--felt,radial-gradient(ellipse at 50% 30%,#1f8a55,#0d5a35 70%,#08391f));border:6px solid #6b3d16;box-shadow:inset 0 0 40px #0008,0 10px 24px #0007}
.bj-row{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:150px}
.bj-lbl{font-weight:800;font-size:14px;color:#e8ffe9;text-shadow:0 1px 2px #000}
.bj-hand{display:flex;justify-content:center;min-height:104px}
.pc{position:relative;width:70px;height:100px;margin-inline-start:-26px;border-radius:9px;perspective:600px;flex:none;animation:deal .3s ease-out}
.pc:first-child{margin-inline-start:0}
@keyframes deal{from{transform:translate(40px,-60px) rotate(12deg);opacity:0}to{transform:none;opacity:1}}
.pc .in{position:absolute;inset:0;transition:transform .45s;transform-style:preserve-3d}
.pc.down .in{transform:rotateY(180deg)}
.pc .fa,.pc .ba{position:absolute;inset:0;border-radius:9px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 3px 8px #0007}
.pc .fa{background:#fffdf7;color:#1b1b1b;display:flex;flex-direction:column;justify-content:space-between;padding:5px 6px;font-weight:900;font-size:18px;line-height:1;direction:ltr}
.pc .fa.r{color:#d0142c}
.pc .fa .mid{align-self:center;font-size:34px}
.pc .fa .bot{align-self:flex-end;transform:rotate(180deg)}
.pc .ba{transform:rotateY(180deg);background:var(--back,repeating-linear-gradient(45deg,#b0124f 0 6px,#8a0c3d 6px 12px));border:4px solid #fff}
.bj-mid{display:flex;align-items:center;justify-content:center;min-height:46px}
.bj-msg{font-size:22px;font-weight:900;color:var(--gold);text-shadow:0 2px 6px #000;animation:pop .3s}
.bj-hands{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}
.bj-h{display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 8px;border-radius:14px;border:2px solid transparent;transition:border-color .2s}
.bj-h.act{border-color:var(--gold);background:#ffd16618}
.bj-h .res{font-weight:900;font-size:14px;color:var(--gold);min-height:18px}
.bj-ctrl{display:flex;flex-direction:column;align-items:center;gap:10px;width:100%}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chipb{width:56px;height:56px;border-radius:50%;border:4px dashed #fff;cursor:pointer;font-weight:900;font-size:14px;color:#fff;box-shadow:0 4px 0 #0007;text-shadow:0 1px 2px #000;transition:transform .1s;touch-action:manipulation}
.chipb:active{transform:translateY(3px);box-shadow:0 1px 0 #0007}
/* ---- wordle ---- */
.wd-grid{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;width:min(340px,100%)}
.wd-row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.wd-row.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.wd-t{aspect-ratio:1;display:flex;align-items:center;justify-content:center;border:2px solid #ffffff33;border-radius:8px;font-size:clamp(20px,7vw,32px);font-weight:900;text-transform:uppercase;background:#0004;transition:transform .15s}
.wd-t.fill{border-color:#ffffff88;transform:scale(1.06)}
.wd-t.ok,.wd-t.mid,.wd-t.no{border-color:transparent;animation:flip .5s both}
.wd-t.ok{background:var(--ok)}.wd-t.mid{background:var(--mid)}
.cb .wd-t.ok,.cb .kb-k.ok{background:#f5793a}.cb .wd-t.mid,.cb .kb-k.mid{background:#85c0f9;color:#10203a}
.wfs-s .wd-t{font-size:clamp(16px,5.5vw,24px)}.wfs-l .wd-t{font-size:clamp(24px,8.5vw,40px)}.wfs-l .kb-k{font-size:20px}.wd-t.no{background:var(--no)}
@keyframes flip{0%{transform:rotateX(0)}50%{transform:rotateX(90deg)}100%{transform:rotateX(0)}}
.kb{display:flex;flex-direction:column;gap:6px;width:min(560px,100%)}
.kb-r{display:flex;gap:4px;justify-content:center}
.kb-k{flex:1 1 0;min-width:0;max-width:46px;height:52px;border:0;border-radius:8px;background:#ffffff2a;font-weight:800;font-size:17px;cursor:pointer;touch-action:manipulation;padding:0}
@media (max-height:700px){.kb-k{height:42px}.kb{gap:5px}.wd-grid,.wd-row{gap:4px}}
.kb-k.wide{flex:1.6 1 0;max-width:72px;font-size:13px}
.kb-k.ok{background:var(--ok)}.kb-k.mid{background:var(--mid)}.kb-k.no{background:#2b2140;color:#ffffff66}
.kb-k:active{filter:brightness(1.4)}
/* ---- 2048 ---- */
.g48{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:10px;width:min(420px,100%);aspect-ratio:1;border-radius:14px;background:#2b1a44;touch-action:none}
.g48 .c{border-radius:10px;background:#ffffff12}
.g48 .t{position:absolute;display:flex;align-items:center;justify-content:center;border-radius:10px;font-weight:900;transition:left .1s,top .1s;color:#fff;text-shadow:0 2px 3px #0006}
.g48 .t.new{animation:tnew .18s}
.g48 .t.mrg{animation:tmrg .18s}
@keyframes tnew{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes tmrg{50%{transform:scale(1.18)}}
/* ---- memory ---- */
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(440px,100%)}
.mc{aspect-ratio:1;perspective:600px;cursor:pointer;border:0;background:none;padding:0}
.mc .in{position:relative;width:100%;height:100%;transition:transform .4s;transform-style:preserve-3d}
.mc.up .in,.mc.done .in{transform:rotateY(180deg)}
.mc .fr,.mc .bk{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.mc .fr{background:linear-gradient(135deg,#ff4fa3,#7b2cbf);border:3px solid #ffd166;display:flex;align-items:center;justify-content:center;font-size:30px}
.mc .bk{transform:rotateY(180deg);background-image:var(--sprite);background-size:900% 100%;border:3px solid #fff}
.mc .bk.em{display:flex;align-items:center;justify-content:center;font-size:clamp(26px,9vw,44px)}
.mc.done .bk{border-color:var(--ok);box-shadow:0 0 14px var(--ok)}
/* ---- reflex ---- */
.rx{width:min(520px,100%);aspect-ratio:4/3;border-radius:18px;border:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:28px;font-weight:900;color:#fff;text-shadow:0 2px 6px #0008;touch-action:manipulation;transition:background .08s}
.rx.wait{background:var(--rxw,#c42737)}.rx.go{background:var(--rxg,#16b35f)}.rx.idle{background:#3a1f66}.rx.early{background:#7a5a00}
.rx small{font-size:16px;font-weight:700}
/* ---- mines ---- */
.mn{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;width:min(440px,100%);touch-action:manipulation}
.mn button{aspect-ratio:1;border:0;border-radius:6px;background:var(--mc,linear-gradient(180deg,#6b3fb0,#4d2a85));font-weight:900;font-size:clamp(14px,4.4vw,20px);cursor:pointer;padding:0;box-shadow:inset 0 -3px 0 #0005}
.mn button.o{background:var(--mo,#ffffff14);box-shadow:none}
.mn button.b{background:#ff5d6c}
.lightmn .n1{color:#1f5fd1}.lightmn .n2{color:#16803c}.lightmn .n3{color:#d0142c}.lightmn .n4{color:#5b21b6}.lightmn .n5{color:#92400e}
.mn .n1{color:#7ec8ff}.mn .n2{color:#7dffb0}.mn .n3{color:#ff8f9a}.mn .n4{color:#c9a0ff}.mn .n5{color:#ffd166}.mn .n6{color:#5ff3ff}.mn .n7,.mn .n8{color:#fff}
/* ---- simon ---- */
.sim{direction:ltr;display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(380px,90%);aspect-ratio:1}
.sim button{border:0;border-radius:24px;cursor:pointer;opacity:.55;transition:opacity .1s,transform .1s;touch-action:manipulation;box-shadow:0 6px 0 #0007}
.sim button.lit{opacity:1;transform:scale(1.04);filter:brightness(1.3)}
.sim button:nth-child(1){background:#2fbf71;border-top-left-radius:50%}.sim button:nth-child(2){background:#ff4f5e;border-top-right-radius:50%}
.sim button:nth-child(3){background:#ffd166;border-bottom-left-radius:50%}.sim button:nth-child(4){background:#3e8bff;border-bottom-right-radius:50%}
/* ---- connect 4 ---- */
.c4{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:10px;width:min(460px,100%);border-radius:16px;background:linear-gradient(180deg,#2d5bff,#1a3bb8);box-shadow:0 8px 0 #0f2370;touch-action:manipulation;direction:ltr}
.c4 button{aspect-ratio:1;border-radius:50%;border:0;background:#0b0616;cursor:pointer;padding:0;box-shadow:inset 0 3px 6px #000a}
.c4 button.p1{background:var(--p1,radial-gradient(circle at 35% 35%,#ff8a8a,#e01e37));animation:drop .35s ease-in}
.c4 button.p2{background:radial-gradient(circle at 35% 35%,#fff0a0,#f4b400);animation:drop .35s ease-in}
.c4 button.win{box-shadow:0 0 0 4px #fff,0 0 18px #fff}
@keyframes drop{from{transform:translateY(-300%)}to{transform:none}}
/* ---- sudoku ---- */
.sd{display:grid;grid-template-columns:repeat(9,1fr);width:min(450px,100%);aspect-ratio:1;border:3px solid #ffd166;border-radius:10px;overflow:hidden;background:#1d1033;direction:ltr}
.sd button{border:0;border-right:1px solid #ffffff22;border-bottom:1px solid #ffffff22;background:transparent;font-weight:800;font-size:clamp(15px,5vw,24px);padding:0;cursor:pointer;color:#9fd8ff}
.sd button.g{color:#fff6e8}
.sd button.c3{border-right:2px solid #ffd166}.sd button.r3{border-bottom:2px solid #ffd166}
.sd button.hl{background:#ffffff10}.sd button.same{background:#5ff3ff33}.sd button.sel{background:#ff4fa366}
.sd button.bad{color:#ff5d6c}
.sd .nt{display:grid;grid-template-columns:repeat(3,1fr);width:100%;height:100%;padding:1px;font-size:clamp(7px,2.1vw,11px);color:#cdb8ef;font-weight:700}
.sd .nt i{font-style:normal;display:flex;align-items:center;justify-content:center}
.sd.light{background:#fffaf0;border-color:#c98a00}.sd.light button{color:#1f5fd1;border-color:#00000018}.sd.light button.g{color:#1b1b1b}.sd.light button.c3{border-right-color:#c98a00}.sd.light button.r3{border-bottom-color:#c98a00}
.sd.light button.hl{background:#0000000a}.sd.light button.same{background:#5ff3ff55}.sd.light button.sel{background:#ff4fa344}.sd.light .nt{color:#6b5a8a}.sd.light button.bad{color:#d0142c}
.nump{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:min(450px,100%)}
.nump .btn{min-height:48px;font-size:20px;padding:0}
.seg{display:flex;gap:4px;background:#0004;padding:4px;border-radius:12px}
.seg button{border:0;border-radius:9px;min-height:36px;padding:4px 12px;background:transparent;cursor:pointer;font-weight:800;color:var(--mut)}
.seg button.on{background:var(--gold);color:#2a1a00}
</style>

<script>

async function emailOf(name){

function authErr(e){

// ---------- ranking maths
function boardRows(board, data = WKD, wk = WK){
  const t0 = (wk * 7 + 3) * DAY, t1 = weekEnd(wk), inWeek = r => !r.t || (r.t >= t0 - 6e4 && r.t < t1 + 6e4);   // a score only counts in the week the server stamped it
  let src;
  if (board === "wordle"){   // best Wordle language board of each player
    src = {}; WORDLE_LANGS.forEach(l => { const b = data["wordle_" + l] || {}; for (const uid in b){ const r = b[uid]; if (!r || !inWeek(r)) continue; if (!src[uid]) src[uid] = {v: r.v, n: r.n}; else { src[uid].v = Math.max(src[uid].v, r.v); src[uid].n += r.n; } } });
  } else src = data[board] || {};
  const dir = gameOf(board).dir;
  const rows = Object.entries(src).filter(([, r]) => r && typeof r.v === "number" && inWeek(r)).map(([uid, r]) => ({uid, v: r.v, n: r.n || 0, t: r.t || 0}));
  rows.sort((a, b) => a.v === b.v ? a.t - b.t : (dir === "lo" ? a.v - b.v : b.v - a.v));
  rows.forEach((r, i) => r.rank = i && rows[i - 1].v === r.v ? rows[i - 1].rank : i + 1);
  return rows;
}
function totals(data = WKD, wk = WK){
  const T = {};
  const row = uid => T[uid] || (T[uid] = {uid, pts: 0, plays: 0, firsts: 0});
  GAMES.forEach(g => boardRows(g.id, data, wk).forEach(r => { const o = row(r.uid); o.pts += PTS[r.rank - 1] || 0; o.plays += r.n; if (r.rank === 1) o.firsts++; }));
  if (typeof DCH !== "undefined") Object.keys(DCH).forEach(uid => { const n = dailyBonus(uid, wk); if (n) row(uid).pts += 3 * n; });   // +3 per daily challenge
  return Object.values(T);
}
function rankList(rows, key){
  rows = rows.filter(r => r[key] > 0).sort((a, b) => b[key] - a[key]);
  rows.forEach((r, i) => r.rank = i && rows[i - 1][key] === r[key] ? rows[i - 1].rank : i + 1);
  return rows;
}

// ---------- score saving
// saves run one after another; each one re-reads the server value first, so a slow load, a cut connection or two quick saves never break the count
let submitQ = Promise.resolve();
let lastErr = "";
const errCode = e => String((e && (e.code || e.message)) || e || "?").replace(/^Error:\s*/, "").slice(0, 40);
function submit(board, val, game){ const p = submitQ.then(() => doSubmit(board, val, game)).then(res => { if (res && res.improved !== undefined && game !== "duel") try { afterSubmit(board, val, game, res); } catch (e) { console.warn(e); } return res; }).catch(e => { console.warn(e); return {}; }); submitQ = p; return p; }
async function doSubmit(board, val, game){
  if (!USER || !FB || banned(USER.uid)) return {};
  if (weekIdx() !== WK) subscribeWeek();
  const g = GBY[game]; val = Math.round(val);
  if (g.max != null && val > g.max) val = g.max;
  if (g.min != null && val < g.min) return {};
  const path = `fun/w/${WK}/${board}/${USER.uid}`;
  lastErr = "";
  if (beginP[board]) await beginP[board];
  let cur;
  try { cur = (await Promise.race([FB.get(R(path)), new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 4000))])).val(); }
  catch (e) { console.warn("get", e); lastErr = errCode(e); cur = (WKD[board] || {})[USER.uid] || null; }   // fall back on the live copy of the rankings
  const n = (cur ? cur.n : 0) + 1;
  let v = g.mode === "add" ? (cur ? cur.v : 0) + val : g.mode === "set" ? val : (cur && !better(val, cur.v, g.dir) ? cur.v : val);

    capped = add < val; v = (cur ? cur.v : 0) + add; extra = {d: today, dp: had + add};

  const rec = REC[board], isRec = g.mode !== "set" && (rec == null || better(v, rec, g.dir));
  lastErr = [lastErr && "get:" + lastErr, beginErr].filter(Boolean).join(" / ");
  const upd = {}; upd[path] = {v, n, t: FB.serverTimestamp(), ...extra};
  if (isRec || (g.mode === "set" && (rec == null || v > rec))) upd[`fun/rec/${USER.uid}/${board}`] = v;
  const before = (WKD[board] || {})[USER.uid];

    renderBoard();
    toast((/PERMISSION/i.test(e.code + e.message) ? t("errDb") : t("saveFail")) + " [" + errCode(e) + (lastErr ? " / " + lastErr : "") + "]", 6000); return {};
  }
  if (upd[`fun/rec/${USER.uid}/${board}`] != null) REC[board] = v;
  const li = $(`#gBoard li[data-u="${USER.uid}"]`); if (li && improved){ li.classList.add("flash"); }
  const rank = (boardRows(board).find(r => r.uid === USER.uid) || {}).rank;

async function translateText(text, from, to){
  const key = from + "|" + to + "|" + text;
  if (TRC[key]) return TRC[key];
  let out = null;

    if (self.Translator){
      const av = await Translator.availability({sourceLanguage: from, targetLanguage: to});
      if (av && av !== "unavailable"){ TRX[from + to] = TRX[from + to] || Translator.create({sourceLanguage: from, targetLanguage: to}); out = await (await TRX[from + to]).translate(text); }
    }

  if (!out){

    const j = await r.json();
    if (!j || +j.responseStatus !== 200 || !j.responseData || /MYMEMORY WARNING/i.test(j.responseData.translatedText || "")) throw new Error((j && j.responseDetails) || "translate");

}

// ---------- bad-word filter (list managed by the admin)
const normW = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function cleanText(x){
  const list = String(CFG.bad || "").split(",").map(w => w.trim()).filter(Boolean);
  if (!list.length) return x;
  let out = x;
  list.forEach(w => { const re = new RegExp("(^|[^\\p{L}\\p{N}])(" + w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")(?=$|[^\\p{L}\\p{N}])", "giu"); out = out.replace(re, (m, a, b) => a + "★".repeat([...b].length)); });
  // same check without accents
  const n = normW(out); list.forEach(w => { const nw = normW(w); let i = n.indexOf(nw); while (i >= 0){ const before = n[i - 1], after = n[i + nw.length]; if ((!before || /[^\p{L}\p{N}]/u.test(before)) && (!after || /[^\p{L}\p{N}]/u.test(after))) out = out.slice(0, i) + "★".repeat(nw.length) + out.slice(i + nw.length); i = n.indexOf(nw, i + 1); } });
  return out;
}

// ---------- pause (Snake, Blocks, Flappy): button, P / Escape key, automatic when the tab is hidden
function makePause(st, A, get, set){
  const hud = st.querySelector(".hud"), b = el("button", "btn sm", "⏸"); b.type = "button"; b.setAttribute("aria-label", A.t("pause"));
  if (hud) hud.appendChild(b); else st.prepend(b);
  let paused = false;
  const pause = () => { if (paused || !get()) return; paused = true; set(false); b.textContent = "▶"; A.overlay({title: "⏸ " + A.t("pause"), btns: [["▶ " + A.t("resume"), resume, "go"]]}); };
  const resume = () => { if (!paused) return; paused = false; st.querySelectorAll(":scope > .ovl").forEach(o => o.remove()); b.textContent = "⏸"; set(true); };
  b.onclick = () => paused ? resume() : pause();
  const kd = e => { if ((e.key === "p" || e.key === "P" || e.key === "Escape") && (get() || paused)){ e.preventDefault(); paused ? resume() : pause(); } };
  const vis = () => { if (document.hidden) pause(); };
  addEventListener("keydown", kd); document.addEventListener("visibilitychange", vis); addEventListener("blur", vis);
  return {isPaused: () => paused, destroy(){ removeEventListener("keydown", kd); document.removeEventListener("visibilitychange", vis); removeEventListener("blur", vis); }};
}

  const d = e => { on = true; sx = e.clientX; sy = e.clientY; t0 = Date.now(); };
  const u = e => { if (!on) return; on = false; const dx = e.clientX - sx, dy = e.clientY - sy;

    if (dead) return true;
    tp();
    setTimeout(() => !dead && A.overlay({title: w1 ? "🎉 " + A.t("c4Win", pts) : w2 ? "🤖 " + A.t("c4Lose") : "🤝 " + A.t("c4Draw"), sub: res && res.rank ? `${A.t("rank")} #${res.rank}` : "", btns: [["🔁 " + A.t("replay"), start, "go"]]}), 900);
    return true;
  }
  async function aiTurn(){
    busy = true; say("🤖 " + A.t("c4Ai")); await new Promise(r => setTimeout(r, 380));
    if (dead) return; place(aiMove(), 2); busy = false;
    if (!(await check())) say("👉 " + A.t("c4You"));
  }
  async function play(c){ if (over || busy || drop(b, c) < 0) return; place(c, 1); if (await check()) return; aiTurn(); }
  const kd = e => { const n = +e.key; if (n >= 1 && n <= 7) play(n - 1); };
  addEventListener("keydown", kd);
  function start(){ b = Array.from({length: RW}, () => Array(CL).fill(0)); over = false; busy = false; paint(); A.begin(); tp(); youFirst = !youFirst; if (youFirst) say("👉 " + A.t("c4You")); else aiTurn(); }
  youFirst = false; start();
  return () => { dead = true; removeEventListener("keydown", kd); };
};

/* =================== SUDOKU =================== */
GAME_IMPL.sudoku = (st, A) => {
  const PTS = {1: 1, 2: 3, 3: 6}, CLUES = {1: 40, 2: 32, 3: 26};
  let lvl = +(ls.get("fun.sdlvl") || 1), sol, puz, cur, sel = -1, mist = 0, t0 = 0, iv, done = false;
  const top = el("div", "row"); top.style.justifyContent = "center";
  const seg = el("div", "seg"); [[1, "lvEasy"], [2, "lvMid"], [3, "lvHard"]].forEach(([v, k]) => { const s = el("button", v === lvl ? "on" : "", A.t(k)); s.type = "button"; s.onclick = () => { lvl = v; ls.set("fun.sdlvl", v); seg.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === s)); start(); }; seg.appendChild(s); });
  const nb = el("button", "btn sm", "🔄 " + A.t("newGame")); nb.type = "button"; nb.onclick = () => start();
  top.append(seg, nb); st.appendChild(top);
  const hud = el("div", "hud", `<span>⏱️ <b class="tm">0:00</b></span><span>${A.t("sdMist")} : <b class="mi">0</b></span><span class="tp"></span>`); st.appendChild(hud);
  const tp = () => hud.querySelector(".tp").textContent = "📅 " + A.t("todayPts", A.dayPts());
  const g = el("div", "sd"); st.appendChild(g);
  const np = el("div", "nump"); st.appendChild(np);
  let notes = Array.from({length: 81}, () => new Set()), noteMode = false;
  const nbtn = el("button", "btn sm", "✏️ " + A.t("sdNotes")); nbtn.type = "button"; nbtn.setAttribute("aria-pressed", "false");
  nbtn.onclick = () => { noteMode = !noteMode; nbtn.classList.toggle("gold", noteMode); nbtn.setAttribute("aria-pressed", String(noteMode)); };
  top.appendChild(nbtn);
  const look = () => { g.classList.toggle("light", !!A.opt("light", 0)); paint(); };
  A.options([{k: "light", label: "o_light", def: 0, ch: [{v: 0, sw: "#1d1033", title: "off"}, {v: 1, sw: "#fffaf0", title: "on"}]}, {k: "hl", label: "o_hl", def: 1, ch: [{v: 1, tx: "✔"}, {v: 0, tx: "✕"}]}], look);
  const cells = []; for (let i = 0; i < 81; i++){ const k = el("button"); k.type = "button"; const r = i / 9 | 0, c = i % 9; if (c === 2 || c === 5) k.classList.add("c3"); if (r === 2 || r === 5) k.classList.add("r3"); k.onclick = () => { sel = i; paint(); }; cells.push(k); g.appendChild(k); }
  for (let n = 1; n <= 9; n++){ const b = el("button", "btn", n); b.type = "button"; b.onclick = () => put(n); np.appendChild(b); }
  { const b = el("button", "btn", "⌫"); b.type = "button"; b.title = A.t("sdErase"); b.onclick = () => put(0); np.appendChild(b); }
  // solver with bit masks; counts solutions up to `lim`
  function solve(a, lim){
    const R = new Array(9).fill(0), Cc = new Array(9).fill(0), B = new Array(9).fill(0), bx = i => (i / 27 | 0) * 3 + ((i % 9) / 3 | 0);
    for (let i = 0; i < 81; i++) if (a[i]){ const m = 1 << a[i]; R[i / 9 | 0] |= m; Cc[i % 9] |= m; B[bx(i)] |= m; }
    let count = 0;
    (function rec(){
      let bi = -1, bm = 0, bc = 10;
      for (let i = 0; i < 81; i++) if (!a[i]){ const m = ~(R[i / 9 | 0] | Cc[i % 9] | B[bx(i)]) & 0x3FE; let n = 0; for (let k = m; k; k &= k - 1) n++; if (n < bc){ bc = n; bi = i; bm = m; if (!n) return; } }
      if (bi < 0){ count++; return; }
      const ds = []; for (let d = 1; d <= 9; d++) if (bm & (1 << d)) ds.push(d);
      if (lim === 1) ds.sort(() => Math.random() - .5);
      for (const d of ds){ const m = 1 << d, r = bi / 9 | 0, c = bi % 9, x = bx(bi); a[bi] = d; R[r] |= m; Cc[c] |= m; B[x] |= m; rec(); if (count >= lim){ if (lim === 1) return; a[bi] = 0; R[r] &= ~m; Cc[c] &= ~m; B[x] &= ~m; return; } a[bi] = 0; R[r] &= ~m; Cc[c] &= ~m; B[x] &= ~m; }
    })();
    return count;
  }
  function generate(){
    const full = new Array(81).fill(0); solve(full, 1);
    const p = full.slice(), order = [...Array(81).keys()].sort(() => Math.random() - .5);
    let clues = 81;
    for (const i of order){ if (clues <= CLUES[lvl]) break; const v = p[i]; p[i] = 0; if (solve(p.slice(), 2) !== 1) p[i] = v; else clues--; }
    return [full, p];
  }
  function start(){
    [sol, puz] = generate(); cur = puz.slice(); notes = Array.from({length: 81}, () => new Set()); sel = -1; mist = 0; done = false; t0 = performance.now(); clearInterval(iv); A.begin(); tp();
    iv = setInterval(() => { const s = (performance.now() - t0) / 1000 | 0; hud.querySelector(".tm").textContent = `${s / 60 | 0}:${String(s % 60).padStart(2, "0")}`; }, 500);
    st.querySelectorAll(":scope > .ovl").forEach(o => o.remove()); paint();
  }
  function paint(){
    const sv = sel >= 0 ? cur[sel] : 0;
    cells.forEach((k, i) => {
      const r = i / 9 | 0, c = i % 9, sr = sel / 9 | 0, sc = sel % 9;
      if (cur[i] || !notes[i].size) k.textContent = cur[i] || ""; else k.innerHTML = `<span class="nt">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<i>${notes[i].has(n) ? n : ""}</i>`).join("")}</span>`;
      k.classList.toggle("g", !!puz[i]); k.classList.toggle("bad", !!cur[i] && cur[i] !== sol[i]);
      k.classList.toggle("sel", i === sel); k.classList.toggle("same", A.opt("hl", 1) && i !== sel && sv && cur[i] === sv);
      k.classList.toggle("hl", A.opt("hl", 1) && sel >= 0 && i !== sel && (r === sr || c === sc || ((r / 3 | 0) === (sr / 3 | 0) && (c / 3 | 0) === (sc / 3 | 0))));
    });
    hud.querySelector(".mi").textContent = mist;
  }
  async function put(n){
    if (done || sel < 0 || puz[sel]) return;
    if (noteMode && n && !cur[sel]){ notes[sel].has(n) ? notes[sel].delete(n) : notes[sel].add(n); return paint(); }
    if (n && n === sol[sel]){ const r = sel / 9 | 0, c = sel % 9; for (let j = 0; j < 81; j++){ const rr = j / 9 | 0, cc = j % 9; if (rr === r || cc === c || ((rr / 3 | 0) === (r / 3 | 0) && (cc / 3 | 0) === (c / 3 | 0))) notes[j].delete(n); } }
    cur[sel] = n; if (n && n !== sol[sel]){ mist++; A.tone(160, .15, "sawtooth", .06); } else if (n) A.tone(660, .05, "triangle", .05);
    paint();
    if (cur.every((v, i) => v === sol[i])){
      done = true; clearInterval(iv); A.confetti(); const pts = PTS[lvl]; if (lvl === 3) unlock("sdhard");
      const res = await A.submit(pts); tp();
      A.overlay({title: "🧩 " + A.t("sdWin", pts), sub: hud.querySelector(".tm").textContent + (res && res.rank ? ` · ${A.t("rank")} #${res.rank}` : ""), btns: [["🔁 " + A.t("newGame"), start, "go"]]});
    }
  }
  const kd = e => {
    if (/^[1-9]$/.test(e.key)) return put(+e.key);
    if (e.key === "Backspace" || e.key === "Delete" || e.key === "0") return put(0);
    const mvk = {ArrowUp: -9, ArrowDown: 9, ArrowLeft: -1, ArrowRight: 1}[e.key];
    if (mvk){ e.preventDefault(); sel = sel < 0 ? 0 : Math.min(80, Math.max(0, sel + mvk)); paint(); }
  };
  addEventListener("keydown", kd);
  start();
  return () => { clearInterval(iv); removeEventListener("keydown", kd); };
};

boot();
</script>
